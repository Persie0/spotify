plugins {
    id "com.android.application"
}

android {
    namespace "com.persie.spotifyskipper"
    compileSdk 36

    defaultConfig {
        applicationId "com.persie.spotifyskipper"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "0.1.0-scaffold"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Modern Xposed API (LibXposed). Provided by the framework at runtime.
    // Scaffold javac-verified against 102.0.0 (2026-09-25).
    compileOnly "io.github.libxposed:api:102.0.0"
}

name: Decode TimelineAds output object

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decode-timelineads-output.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/tads
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/tads
      - name: Decode
        run: |
          set -euo pipefail
          SO=/tmp/tads/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/tads/all.dis
          {
            echo '# TimelineAdsSetupImpl output object'
            echo
            echo 'Provider: ID 0xb7, AP 0x1867300, factory 0x13524a4.'
            echo
            echo '## Factory prologue / owner creation'
            objdump -d -M intel --start-address=0x13524a4 --stop-address=0x1352680 "$SO"
            echo
            echo '## Factory finalization / return'
            objdump -d -M intel --start-address=0x1353100 --stop-address=0x1353454 "$SO"
            echo
            echo '## Every rbx definition in factory'
            awk '/^[[:space:]]*13524a4:/{p=1} p{print} /^[[:space:]]*1353453:/{p=0}' /tmp/tads/all.dis | grep -E '^[[:space:]]*[0-9a-f]+:.*(mov|lea|xchg|pop)[[:space:]]+rbx\b' || true
            echo
            echo '## Heap allocations in factory'
            awk '/^[[:space:]]*13524a4:/{p=1} p{print} /^[[:space:]]*1353453:/{p=0}' /tmp/tads/all.dis | grep -E -B16 -A28 'call[[:space:]]+17edf00\b' || true
            echo
            echo '## Writes through output-like first argument registers'
            awk '/^[[:space:]]*13524a4:/{p=1} p{print} /^[[:space:]]*1353453:/{p=0}' /tmp/tads/all.dis | grep -E -B10 -A18 'mov[[:space:]]+QWORD PTR \[(r12|r13|r14|r15|rbp|rbx)(\+0x[0-9a-f]+)?\],' || true
          } > analysis/timelineads-output-object.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/timelineads-output-object.md
          git diff --cached --quiet && exit 0
          git commit -m "Decode TimelineAds output object"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 1; done
          exit 1

name: Resolve d85524 interface owner

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/resolve-d85524-interface-owner.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/d855
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/d855

      - name: Resolve interface
        run: |
          SO=/tmp/d855/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/d855/all.dis
          readelf -rW "$SO" > /tmp/d855/rel.txt
          {
            echo '# d85524 interface owner / caller provenance'
            echo
            echo 'Known: incoming rsi of d85524 becomes carrier[0], whose vtable+0x1d8 is called by d8a5c2.'
            echo
            echo '## Direct code refs/calls/jumps to d85524'
            grep -n -E -B30 -A45 '(call|jmp)[[:space:]]+d85524\b|# d85524\b' /tmp/d855/all.dis || true
            echo
            echo '## Relocations targeting d85524'
            grep -i -E '[[:space:]]d85524([[:space:]]|$)' /tmp/d855/rel.txt || true
            echo
            echo '## Vtable neighborhoods for every relocation target d85524'
            python3 - <<'PY'
          import re,struct
          from pathlib import Path
          rel={}
          for l in Path('/tmp/d855/rel.txt').read_text(errors='replace').splitlines():
            p=l.split()
            if len(p)>=3 and re.fullmatch(r'[0-9a-fA-F]+',p[0]) and 'R_X86_64_RELATIVE' in l:
              i=p.index('R_X86_64_RELATIVE')
              if i+1<len(p) and re.fullmatch(r'[0-9a-fA-F]+',p[i+1]):
                rel[int(p[0],16)]=int(p[i+1],16)
          slots=[va for va,t in rel.items() if t==0xd85524]
          print('slots=',[hex(x) for x in slots])
          for slot in slots:
            print(f'### relocation slot 0x{slot:x}')
            for base in range(slot-0x60,slot+0x18,8):
              vals=[rel.get(base+o) for o in range(0,0x100,8)]
              # print only plausible contiguous tables around slot
              code=sum(1 for v in vals if v and 0x900000<=v<0x1800000)
              if code>=8:
                print(f'- candidate AP 0x{base:x}; target offset +0x{slot-base:x}; codeSlots={code}')
                for o,v in enumerate(vals):
                  if v: print(f'  +0x{o*8:x}: 0x{v:x}')
            print()
          PY
            echo
            echo '## All high-address AP materializations near candidate relocation slots'
            for addr in $(grep -i -E '[[:space:]]d85524([[:space:]]|$)' /tmp/d855/rel.txt | awk '{print $1}'); do
              low=$(python3 - <<PY
          a=int("$addr",16); print(f"{max(0,a-0x80):x}")
          PY
          )
              high=$(python3 - <<PY
          a=int("$addr",16); print(f"{a+0x80:x}")
          PY
          )
              echo "slot=$addr range=$low..$high"
              grep -n -E -B12 -A24 "# (0*)?($addr|$low|$high)" /tmp/d855/all.dis || true
            done
            echo
            echo '## Full d85524 body'
            objdump -d -M intel --start-address=0xd85524 --stop-address=0xd85885 "$SO"
          } > analysis/d85524-interface-owner.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/d85524-interface-owner.md
          git diff --cached --quiet && exit 0
          git commit -m "Resolve d85524 interface owner"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

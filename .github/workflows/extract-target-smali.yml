name: Extract Spotify target smali

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/extract-target-smali.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true

      - name: Download Spotify r1 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-*.apk" --dir input
          echo "APK=$(find input -type f -name '*.apk' -print -quit)" >> "$GITHUB_ENV"

      - name: Install apktool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apktool

      - name: Decode DEX to smali
        run: |
          rm -rf /tmp/spotify-smali
          apktool d -f -r "$APK" -o /tmp/spotify-smali

      - name: Extract target classes
        run: |
          rm -rf analysis/smali-targets
          mkdir -p analysis/smali-targets

          targets="pqd0 pdp0 rpd0 sc11 qm0 fzg1 be11"
          for target in $targets; do
            found="$(find /tmp/spotify-smali -type f -path '*/p/'"$target"'.smali' -print -quit)"
            if [ -z "$found" ]; then
              found="$(find /tmp/spotify-smali -type f -name "$target.smali" -print -quit)"
            fi
            if [ -n "$found" ]; then
              cp "$found" "analysis/smali-targets/$target.smali"
              echo "$target <- $found"
            else
              echo "::warning::Could not locate $target.smali"
            fi
          done

          {
            echo "# Target smali extraction"
            echo
            echo "Extracted from release `r1` / `$(basename "$APK")` using apktool."
            echo
            echo "These files preserve bytecode-level control flow for target classes where JADX reconstruction is incomplete."
            echo
            echo "Targets: `pqd0`, `pdp0`, `rpd0`, `sc11`, `qm0`, `fzg1`, `be11`."
          } > analysis/smali-targets/README.md

          test -f analysis/smali-targets/pqd0.smali

      - name: Build bytecode xref report
        run: |
          {
            echo "# pqd0 method declarations"
            grep -n '^\.method' analysis/smali-targets/pqd0.smali || true
            echo
            echo "# pqd0 action-mask / skip-next references"
            grep -n -B12 -A18 -E '0x20|setActions|PlaybackStateCompat;->' analysis/smali-targets/pqd0.smali || true
            echo
            echo "# ad skippability strings across decoded bytecode"
            grep -R -n -B6 -A10 -E 'ad\.skippable_ad_delay|ad\.is_skippable' /tmp/spotify-smali/smali* 2>/dev/null || true
            echo
            echo "# sc11 constructor references"
            grep -R -n -B16 -A8 'Lp/sc11;-><init>' /tmp/spotify-smali/smali* 2>/dev/null || true
            echo
            echo "# be11 constructor references"
            grep -R -n -B16 -A8 'Lp/be11;-><init>' /tmp/spotify-smali/smali* 2>/dev/null || true
            echo
            echo "# disallowSkippingNext references"
            grep -R -n -B8 -A12 -E 'disallowSkippingNext|disallow_skipping_next' /tmp/spotify-smali/smali* 2>/dev/null || true
          } > analysis/smali-targets/xrefs.txt

          # Keep the report manageable while preserving matching context.
          wc -l analysis/smali-targets/xrefs.txt

      - name: Commit target smali
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/smali-targets
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Extract target Spotify smali for deep tracing"
          git push origin HEAD:main

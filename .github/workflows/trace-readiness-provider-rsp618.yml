name: Trace readiness provider rsp618

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trace-readiness-provider-rsp618.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/rsp618
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/rsp618

      - name: Install helper
        run: python3 -m pip install --quiet pyelftools

      - name: Trace caller-local provider
        run: |
          SO=/tmp/rsp618/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/rsp618/all.dis
          readelf -rW "$SO" > /tmp/rsp618/rel.txt
          python3 - <<'PY' > analysis/readiness-provider-rsp618.md
          from pathlib import Path
          import re,bisect
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/rsp618/liborbit-jni-spotify.so')
          lines=Path('/tmp/rsp618/all.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m: ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]

          with so.open('rb') as f:
            elf=ELFFile(f); dwarf=elf.get_dwarf_info(); fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location']; z=a+e['address_range']
                if z>a:fdes.append((a,z))
          fdes.sort(); starts=[x[0] for x in fdes]
          def fde(a):
            k=bisect.bisect_right(starts,a)-1
            return fdes[k] if k>=0 and fdes[k][0] <= a < fdes[k][1] else None
          def ix(a): return bisect.bisect_left(addrs,a)
          def ctx(a,b=22,n=35):
            j=ix(a)
            return '\n'.join('    '+x[3] for x in ins[max(0,j-b):min(len(ins),j+n+1)])
          def body(fr):
            j=ix(fr[0]); out=[]
            for x in ins[j:]:
              if x[0]>=fr[1]: break
              out.append(x)
            return out

          call=0xe91e06
          fr=fde(call)
          print('# Readiness provider caller-local rsp+0x618 trace')
          print()
          print('Known alias:')
          print('- e91df6: rsi = caller rsp+0x260')
          print('- e92f2c saves that pointer in r13')
          print('- e94787 reads [r13+0x3b8]')
          print('- therefore the concrete caller-local provider slot is rsp+0x618 before e91e06')
          print()
          print('Caller FDE:', tuple(hex(x) for x in fr) if fr else None)
          print()

          if fr:
            b=body(fr)
            print('## Direct references to rsp+0x600..0x630 in caller FDE')
            pat=re.compile(r'\[rsp\+0x([0-9a-f]+)\]')
            hits=[]
            for a,i,op,l in b:
              mm=pat.search(op)
              if mm and 0x600 <= int(mm.group(1),16) <= 0x630:
                hits.append((a,op,l))
                print(l)
            print()

            print('## Context for rsp+0x618 direct references')
            for a,op,l in hits:
              if '0x618]' in op:
                print(f'### 0x{a:x}: {op}')
                print(ctx(a,28,42)); print()

            print('## LEA/address-taking aliases that can target rsp+0x618')
            for a,i,op,l in b:
              # exact &slot or bases whose later fixed displacement lands on +0x618
              if re.search(r'lea\s+r(?:ax|bx|cx|dx|si|di|bp|8|9|10|11|12|13|14|15),\[rsp\+0x618\]',op):
                print(f'### 0x{a:x}: {op}')
                print(ctx(a,20,35)); print()

            print('## Writes to exact slot rsp+0x618 before e91e06')
            for a,i,op,l in b:
              if a>=call: break
              if ',' in op and '[rsp+0x618]' in op.split(',',1)[0]:
                print(f'### 0x{a:x}: {op}')
                print(ctx(a,32,45)); print()

            print('## Nearby virtual/materializer calls before e91e06 involving 0x600..0x630 locals')
            for a,i,op,l in b:
              if a>=call: break
              if op.startswith('call') or op.startswith('jmp'):
                j=ix(a)
                neighborhood='\n'.join(x[2] for x in ins[max(0,j-10):j+2])
                if any(f'rsp+0x{o:x}' in neighborhood for o in range(0x600,0x631,8)):
                  print(f'### call/jump 0x{a:x}: {op}')
                  print(ctx(a,18,24)); print()

            print('## Full window around final construction and e91e06')
            lo=max(fr[0],0xe91800); hi=min(fr[1],0xe91e20)
            for a,i,op,l in b:
              if lo<=a<hi: print(l)

          print()
          print('## Exact e92f entry/use bridge')
          print(ctx(0xe92f2c,5,16))
          print(ctx(0xe94787,18,24))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/readiness-provider-rsp618.md
          git diff --cached --quiet && exit 0
          git commit -m "Trace readiness provider rsp618"
          git pull --rebase origin main
          git push

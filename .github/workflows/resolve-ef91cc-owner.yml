name: Resolve ef91cc vtable owner

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/resolve-ef91cc-owner.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/efowner
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/efowner
      - name: Trace
        run: |
          SO=/tmp/efowner/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/efowner/all.dis
          readelf -rW "$SO" > /tmp/efowner/rel.txt
          {
            echo '# ef91cc vtable owner'
            echo
            echo '## relocations around 0x18365d0..0x1836680'
            grep -E '^0000000001836(5[d-f][0-9a-f]|6[0-7][0-9a-f])' /tmp/efowner/rel.txt || true
            echo
            echo '## exact code refs to 0x1836600..0x1836640'
            grep -E -B20 -A36 '# 18366(00|08|10|18|20|28|30|38|40)\b' /tmp/efowner/all.dis || true
            echo
            echo '## exact relocation slots pointing to ef91b6 / ef91cc'
            grep -E ' ef91(b6|cc)$' /tmp/efowner/rel.txt || true
            echo
            echo '## ef91b6 / ef91cc entry'
            objdump -d -M intel --start-address=0xef9180 --stop-address=0xef9260 "$SO"
            echo
            echo '## constructors/materializers near references'
            for A in 1836600 1836608 1836610; do
              grep -F -B32 -A60 "# $A " /tmp/efowner/all.dis || true
            done
          } > analysis/ef91cc-vtable-owner.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ef91cc-vtable-owner.md
          git diff --cached --quiet && exit 0
          git commit -m "Resolve ef91cc vtable owner"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 1; done
          exit 1

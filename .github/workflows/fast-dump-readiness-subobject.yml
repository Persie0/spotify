name: Fast dump readiness subobject

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fast-dump-readiness-subobject.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/rsubfast
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/rsubfast
      - name: Dump
        run: |
          SO=/tmp/rsubfast/liborbit-jni-spotify.so
          {
            echo '# Fast readiness subobject dump'
            echo
            echo '## f419b4 constructor'
            objdump -d -M intel --start-address=0xf41980 --stop-address=0xf41b80 "$SO"
            echo
            echo '## vtable/high-address refs in constructor'
            objdump -d -M intel --start-address=0xf41980 --stop-address=0xf41b80 "$SO" | grep -E '# 18[0-9a-f]{5,}' || true
            echo
            echo '## relocations around all referenced 0x18xxxxxx addresses'
            for A in $(objdump -d -M intel --start-address=0xf41980 --stop-address=0xf41b80 "$SO" | sed -nE 's/.*# (18[0-9a-f]{5,}).*/\1/p' | sort -u); do
              START=$(printf '%x' $((0x$A-0x20)))
              END=$(printf '%x' $((0x$A+0x180)))
              echo "### around 0x$A"
              readelf -rW "$SO" | awk -v s="0x$START" -v e="0x$END" '
                function h2d(h,  i,c,n,v){h=tolower(h);n=0;for(i=1;i<=length(h);i++){c=substr(h,i,1);v=index("0123456789abcdef",c)-1;n=n*16+v}return n}
                /^[0-9a-f]/ {x=h2d($1); if(x>=h2d(substr(s,3)) && x<h2d(substr(e,3))) print}
              ' || true
            done
          } > analysis/skip-ad-readiness-subobject-fast.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/skip-ad-readiness-subobject-fast.md
          git diff --cached --quiet && exit 0
          git commit -m "Fast dump readiness subobject"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

name: Trace concrete P+0x40 writer

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trace-p-plus40-concrete-writer.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/p40
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/p40

      - name: Install ELF helper
        run: python3 -m pip install --quiet pyelftools

      - name: Build compact writer report
        run: |
          SO=/tmp/p40/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/p40/all.dis
          python3 - <<'PY' > analysis/p-plus40-concrete-writer-compact.md
          from pathlib import Path
          import bisect, collections, re
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          raw = Path('/tmp/p40/all.dis').read_text(errors='replace').splitlines()
          ins = []
          for line in raw:
              m = re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$', line)
              if m:
                  ins.append((int(m.group(1), 16), m.group(2).strip()))

          with open('/tmp/p40/liborbit-jni-spotify.so', 'rb') as fh:
              dwarf = ELFFile(fh).get_dwarf_info()
              fdes = sorted(
                  (e['initial_location'], e['initial_location'] + e['address_range'])
                  for e in dwarf.EH_CFI_entries()
                  if isinstance(e, FDE) and e['address_range']
              )
          starts = [x[0] for x in fdes]

          def get_fde(addr):
              i = bisect.bisect_right(starts, addr) - 1
              if i >= 0 and fdes[i][0] <= addr < fdes[i][1]:
                  return fdes[i]
              return None

          mem = re.compile(r'\[([a-z0-9]+)(?:\+0x([0-9a-f]+))?\]')
          by_fde = collections.defaultdict(list)
          for a, op in ins:
              fr = get_fde(a)
              if fr:
                  by_fde[fr].append((a, op))

          observed = {}
          for fr, rows in by_fde.items():
              d = collections.defaultdict(set)
              for a, op in rows:
                  for m in mem.finditer(op):
                      d[m.group(1)].add(int(m.group(2), 16) if m.group(2) else 0)
              observed[fr] = d

          p_offsets = {0,8,0x10,0x18,0x20,0x28,0x30,0x38,0x40,0x48,0x50,0x58,0x60,0x68,0x70,0x78,0x80,0x88}
          outer_offsets = {x + 0x18 for x in p_offsets}
          direct, takes = [], []

          for fr, rows in by_fde.items():
              for i, (a, op) in enumerate(rows):
                  lhs = op.split(',', 1)[0]
                  mm = mem.search(lhs)
                  if mm and re.match(r'^(mov|movq|movabs|xchg|cmpxchg|and|or)\b', op):
                      reg = mm.group(1)
                      off = int(mm.group(2), 16) if mm.group(2) else 0
                      if off in (0x40, 0x58):
                          mode = 'P' if off == 0x40 else 'outer'
                          expected = p_offsets if mode == 'P' else outer_offsets
                          score = len(observed[fr].get(reg, set()) & expected)
                          direct.append((score, a, fr, reg, mode, op, sorted(observed[fr].get(reg, set()))))

                  if op.startswith('lea '):
                      mm = mem.search(op)
                      if not mm:
                          continue
                      reg = mm.group(1)
                      off = int(mm.group(2), 16) if mm.group(2) else 0
                      if off not in (0x38, 0x40, 0x50, 0x58):
                          continue
                      call = next(((a2, o2) for a2, o2 in rows[i+1:i+9] if o2.startswith('call ')), None)
                      if not call:
                          continue
                      mode = 'P' if off in (0x38, 0x40) else 'outer'
                      expected = p_offsets if mode == 'P' else outer_offsets
                      score = len(observed[fr].get(reg, set()) & expected)
                      takes.append((score, a, fr, reg, mode, off, op, call))

          direct.sort(key=lambda x: (x[0], -x[1]), reverse=True)
          takes.sort(key=lambda x: (x[0], -x[1]), reverse=True)

          print('# Compact P+0x40 / outer+0x58 writer candidates')
          print()
          print('Known: P is AP 0x1832be8 at outer+0x18; fd381a receiver field is P+0x40 = outer+0x58.')
          print()

          print('## Direct writes — top 100')
          for score, a, fr, reg, mode, op, offs in direct[:100]:
              off_text = ','.join(hex(x) for x in offs)
              print(f'- 0x{a:x} | {mode} | score={score} | FDE=0x{fr[0]:x}..0x{fr[1]:x} | {reg}=[{off_text}] | {op}')

          print()
          print('## Address-takes of target/pair followed by call — top 100')
          for score, a, fr, reg, mode, off, op, call in takes[:100]:
              print(f'- 0x{a:x} | {mode}+0x{off:x} | score={score} | FDE=0x{fr[0]:x}..0x{fr[1]:x} | next=0x{call[0]:x} {call[1]} | {op}')

          print()
          print('## Creator FDE target-neighborhood refs (0xe94700..0xe98f3b)')
          for a, op in ins:
              if 0xe94700 <= a < 0xe98f3b and any(tok in op for tok in ('+0x38]', '+0x40]', '+0x48]', '+0x50]', '+0x58]', '+0x60]')):
                  print(f'- 0x{a:x}: {op}')

          print()
          print('## P implementation-family refs (0xec0000..0xec8000)')
          for a, op in ins:
              if 0xec0000 <= a < 0xec8000 and any(tok in op for tok in ('+0x38]', '+0x40]', '+0x48]', '+0x50]', '+0x58]', '+0x60]')):
                  print(f'- 0x{a:x}: {op}')
          PY

      - name: Commit compact report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/p-plus40-concrete-writer-compact.md
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "Trace compact P plus40 writer"
          git push

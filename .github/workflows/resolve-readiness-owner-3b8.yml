name: Resolve readiness owner 3b8 provider

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/resolve-readiness-owner-3b8.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/r3b8
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/r3b8

      - name: Install helper
        run: python3 -m pip install --quiet pyelftools

      - name: Resolve same-owner writers
        run: |
          SO=/tmp/r3b8/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/r3b8/all.dis
          python3 - <<'PY' > analysis/readiness-owner-3b8-provider.md
          from pathlib import Path
          import re,bisect
          from collections import defaultdict
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/r3b8/liborbit-jni-spotify.so')
          lines=Path('/tmp/r3b8/all.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m: ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]

          with so.open('rb') as f:
            elf=ELFFile(f); dwarf=elf.get_dwarf_info(); fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location']; z=a+e['address_range']
                if z>a:fdes.append((a,z))
          fdes.sort(); starts=[a for a,z in fdes]

          def fde(a):
            k=bisect.bisect_right(starts,a)-1
            if k>=0 and fdes[k][0]<=a<fdes[k][1]: return fdes[k]
          def ix(a): return bisect.bisect_left(addrs,a)
          def ctx(a,b=22,n=34):
            j=ix(a)
            return '\n'.join('    '+x[3] for x in ins[max(0,j-b):min(len(ins),j+n+1)])
          def body(fr):
            j=ix(fr[0]); out=[]
            for x in ins[j:]:
              if x[0]>=fr[1]: break
              out.append(x)
            return out

          anchors=(0x3b8,0x428,0x470,0x570,0x598)
          mempat=re.compile(r'\[(r(?:ax|bx|cx|dx|si|di|bp|sp|8|9|10|11|12|13|14|15))\+0x([0-9a-f]+)\]')
          byfde=defaultdict(lambda:defaultdict(list))
          for a,i,op,l in ins:
            fr=fde(a)
            if not fr: continue
            for reg,offhex in mempat.findall(op):
              off=int(offhex,16)
              if off in anchors:
                byfde[fr][reg].append((a,off,op,l))

          def is_write(op, reg, off):
            if ',' not in op:return False
            lhs=op.split(',',1)[0]
            return f'[{reg}+0x{off:x}]' in lhs

          print('# Readiness owner +0x3b8 provider resolution')
          print()
          print('Target use:')
          print('- e94787 reads [owner+0x3b8]')
          print('- virtual +0x10 on that provider returns a 16-byte pair')
          print('- pair feeds AP 0x1832be8/cache wrapper -> carrier AP 0x1843bf8 -> owner+0x428 readiness chain')
          print()
          print('Owner fingerprint anchors: +0x428, +0x470, +0x570, +0x598.')
          print()

          matches=[]
          for fr,regs in byfde.items():
            for reg,rows in regs.items():
              offs={x[1] for x in rows}
              if 0x3b8 in offs and len(offs & {0x428,0x470,0x570,0x598})>=1:
                score=len(offs & set(anchors))*10 + sum(1 for a,o,op,l in rows if o==0x3b8 and is_write(op,reg,o))*20
                matches.append((score,fr,reg,rows))
          matches.sort(reverse=True,key=lambda x:x[0])

          print('## Same-base FDE matches')
          for score,fr,reg,rows in matches:
            print(f'### score={score} FDE=0x{fr[0]:x}..0x{fr[1]:x} base={reg}')
            for a,o,op,l in rows:
              rw='WRITE' if is_write(op,reg,o) else 'READ'
              print(f'- {rw} +0x{o:x} @0x{a:x}: {op}')
            print()

          print('## +0x3b8 writes from same-base owner matches')
          seen=set()
          for score,fr,reg,rows in matches:
            for a,o,op,l in rows:
              if o==0x3b8 and is_write(op,reg,o) and a not in seen:
                seen.add(a)
                print(f'### 0x{a:x}; FDE=0x{fr[0]:x}..0x{fr[1]:x}; base={reg}; score={score}')
                print(ctx(a,35,55)); print()

          print('## All nonzero-looking +0x3b8 writes globally (for alias recovery)')
          count=0
          for a,i,op,l in ins:
            m=mempat.search(op)
            if not m or int(m.group(2),16)!=0x3b8: continue
            reg=m.group(1)
            if not is_write(op,reg,0x3b8): continue
            # omit obvious zero stores
            if re.search(r'\b(xmm0|0x0)\b',op) and ('movups' in op or 'and' in op): continue
            print(f'### 0x{a:x}; FDE={fde(a)}: {op}')
            print(ctx(a,18,28)); print()
            count+=1
            if count>=120: break

          print('## Exact known use e94787')
          print(ctx(0xe94787,24,42))
          print()

          print('## Constructor/reset zeroing references')
          for a in (0x1099796,0x10a6444):
            print(f'### 0x{a:x}')
            print(ctx(a,18,25)); print()
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/readiness-owner-3b8-provider.md
          git diff --cached --quiet && exit 0
          git commit -m "Resolve readiness owner 3b8 provider"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

name: Trace Restrictions bundle vtable

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trace-restrictions-bundle-vtable.yml"

permissions:
  contents: write

# kick: start first registered run

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/restrictions-vtable
          gh release download r1 --repo "Persie0/spotify" --pattern "spotify-9-1-84-2205.apk" --dir /tmp/restrictions-vtable
          unzip -j /tmp/restrictions-vtable/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/restrictions-vtable
      - name: Resolve vtable and methods
        run: |
          SO=/tmp/restrictions-vtable/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/restrictions-vtable/all.dis
          readelf -rW "$SO" > /tmp/restrictions-vtable/relocs.txt
          python3 - <<'PY' > analysis/restrictions-bundle-vtable.md
          from pathlib import Path
          import re, bisect

          dis = Path('/tmp/restrictions-vtable/all.dis').read_text(errors='replace').splitlines()
          rel = Path('/tmp/restrictions-vtable/relocs.txt').read_text(errors='replace').splitlines()
          ins=[]; labels=[]
          for i,line in enumerate(dis):
              lm=re.match(r'^([0-9a-f]+)\s+<([^>]+)>:', line)
              if lm: labels.append((int(lm.group(1),16), i, lm.group(2)))
              m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$', line)
              if m: ins.append((int(m.group(1),16), i, m.group(2), line))
          addrs=[a for a,_,_,_ in ins]
          lab_addrs=[a for a,_,_ in labels]
          def idx(a): return bisect.bisect_left(addrs,a)
          def lab(a):
              if a is None: return ''
              j=bisect.bisect_right(lab_addrs,a)-1
              return labels[j][2] if j>=0 else ''
          def md(s): return str(s).replace('|','\\|').replace('\n',' ')
          def ops(op):
              p=op.split(None,1)
              if len(p)<2: return (p[0] if p else '', [])
              mn,rest=p; out=[]; cur=''; depth=0
              for ch in rest:
                  if ch=='[': depth+=1
                  elif ch==']': depth-=1
                  if ch==',' and depth==0:
                      out.append(cur.strip()); cur=''
                  else: cur+=ch
              if cur.strip(): out.append(cur.strip())
              return mn,out
          def norm(x): return re.sub(r'^(BYTE|WORD|DWORD|QWORD|XMMWORD|YMMWORD) PTR\s+','',x).strip()
          def mem(x):
              m=re.search(r'\[([a-z0-9]+)(?:([+-])0x([0-9a-f]+))?\]', x)
              if not m: return None
              off=int(m.group(3) or '0',16)
              if m.group(2)=='-': off=-off
              return (m.group(1),off)
          relocs={}; tails={}
          for line in rel:
              m=re.match(r'\s*([0-9a-fA-F]+)\s+\S+\s+(R_X86_64_[A-Z0-9_]+)\s*(.*)$', line)
              if not m: continue
              addr=int(m.group(1),16); typ=m.group(2); tail=m.group(3).strip()
              if typ=='R_X86_64_RELATIVE':
                  hm=re.search(r'([0-9a-fA-F]+)$', tail)
                  if hm:
                      relocs[addr]=int(hm.group(1),16); tails[addr]=tail
              else:
                  tails[addr]=typ+' '+tail
          regs=['rax','rbx','rcx','rdx','rsi','rdi','rbp','rsp','r8','r9','r10','r11','r12','r13','r14','r15']
          args=['rdi','rsi','rdx','rcx','r8','r9']
          sub={'eax':'rax','ebx':'rbx','ecx':'rcx','edx':'rdx','esi':'rsi','edi':'rdi','r8d':'r8','r9d':'r9','r10d':'r10','r11d':'r11','r12d':'r12','r13d':'r13','r14d':'r14','r15d':'r15','al':'rax','cl':'rcx'}
          def creg(r): return sub.get(r,r)
          def analyze(t, limit=0x500):
              body=[x for x in ins if t <= x[0] < t+limit]
              st={r:None for r in regs}
              for r in args: st[r]='arg:'+r
              refs=[]; writes=[]; calls=[]; rets=[]
              for a,i,op,line in body:
                  mn,os=ops(op)
                  for ar in os:
                      b=mem(ar); base=creg(b[0]) if b else None
                      if b and st.get(base):
                          d=st[base]+(f'{b[1]:+x}' if b[1] else '')
                          refs.append((a,d,line))
                          if os and norm(os[0])==norm(ar) and mn not in ('cmp','test'):
                              writes.append((a,d,line))
                  if mn=='call': calls.append((a,{r:st.get(r) for r in args if st.get(r)},line))
                  if mn.startswith('ret'): rets.append((a,line))
                  if not os: continue
                  dst=norm(os[0]); dr=creg(dst)
                  if dr not in regs: continue
                  if mn=='lea' and len(os)>1:
                      b=mem(os[1]); base=creg(b[0]) if b else None
                      st[dr]=st[base]+(f'{b[1]:+x}' if b and b[1] else '') if b and st.get(base) else None
                  elif mn=='mov' and len(os)>1:
                      src=norm(os[1]); sr=creg(src)
                      if sr in regs and st.get(sr): st[dr]=st[sr]
                      else:
                          b=mem(src); base=creg(b[0]) if b else None
                          st[dr]=f'load({st[base]}{b[1]:+x})' if b and st.get(base) else None
                  elif mn not in ('cmp','test'):
                      st[dr]=None
              return body,refs,writes,calls,rets

          ap=0x187e3c8
          print('# Restrictions bundle vtable trace')
          print('\nPurpose: resolve the vptr stored into `[rsp+0x2e0]` and inspect the methods called by `166103c`.')
          print('\n## Proven vptr materialization')
          print('```text\n14ce65f  lea rax, [rip+...]  # 0x187e3c8\n14ce666  lea rcx, [rsp+0x310]\n14ce66e  mov [rcx-0x30], rax   ; [rsp+0x2e0] = 0x187e3c8\n```')
          print('\n## Vtable/address-point entries around `0x187e3c8`')
          print('| offset | entry addr | target | label | reloc |\n|---:|---:|---:|---|---|')
          for off in [-0x20,-0x18,-0x10,-0x8,0,8,0x10,0x18,0x20,0x28,0x30,0x38,0x40,0x48,0x50,0x58,0x60]:
              ea=ap+off; val=relocs.get(ea)
              print(f'| `{off:+#x}` | `0x{ea:x}` | `{("0x%x"%val) if val else "?"}` | `{md(lab(val))}` | `{md(tails.get(ea,""))}` |')
          print('\n## Methods reached from `166103c`')
          dispatch={0x10:0x1661089,0x30:0x1661095,0x18:0x16610a2}
          print('| callsite | vtable offset | target | label |\n|---:|---:|---:|---|')
          for off,cs in dispatch.items():
              val=relocs.get(ap+off)
              print(f'| `0x{cs:x}` | `+0x{off:x}` | `{("0x%x"%val) if val else "?"}` | `{md(lab(val))}` |')
          for off,cs in dispatch.items():
              val=relocs.get(ap+off)
              print(f'\n## Method `+0x{off:x}` from callsite `0x{cs:x}` -> `{("0x%x"%val) if val else "?"}`')
              if val is None:
                  print('- unresolved from relocations')
                  continue
              body,refs,writes,calls,rets=analyze(val)
              print(f'- label: `{md(lab(val))}`')
              print(f'- scanned instructions: `{len(body)}`')
              print(f'- arg-memory refs: `{len(refs)}`')
              print(f'- arg-derived writes/indirect calls: `{len(writes)}`')
              print(f'- calls: `{len(calls)}`')
              print(f'- returns in scan window: `{len(rets)}`')
              print('\n### Entry excerpt\n```text')
              for _,_,_,line in body[:70]: print('    '+line)
              if len(body)>70: print(f'    ... truncated {len(body)-70} additional instructions ...')
              print('```')
              print('\n### Arg-derived writes / indirect calls')
              if not writes: print('- none')
              else:
                  print('| addr | location | instruction |\n|---|---|---|')
                  for a,d,line in writes[:60]: print(f'| `0x{a:x}` | `{md(d)}` | `{md(line.strip())}` |')
              print('\n### Calls inside method')
              if not calls: print('- none')
              else:
                  print('| call | tracked args | instruction |\n|---|---|---|')
                  for a,st,line in calls[:60]:
                      s=', '.join(f'{k}={v}' for k,v in st.items())
                      print(f'| `0x{a:x}` | `{md(s)}` | `{md(line.strip())}` |')
          print('\n## Interpretation')
          print('- `+0x30` is the dispatch at `1661095` after building a local descriptor whose `+0x8` points to the post-`17add2a` object.')
          print('- If `+0x30` writes through `arg:rdi+0x30`, that closes the Restrictions factory `rdx+0x30` source; otherwise follow the method-specific delegate call.')
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/restrictions-bundle-vtable.md
          git diff --cached --quiet && exit 0
          git commit -m "Trace Restrictions bundle vtable"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1
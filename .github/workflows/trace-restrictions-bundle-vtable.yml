name: Trace Restrictions bundle vtable

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trace-restrictions-bundle-vtable.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/restrictions-vtable
          gh release download r1 --repo "Persie0/spotify" --pattern "spotify-9-1-84-2205.apk" --dir /tmp/restrictions-vtable
          unzip -j /tmp/restrictions-vtable/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/restrictions-vtable
      - name: Resolve vtable and methods
        run: |
          SO=/tmp/restrictions-vtable/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/restrictions-vtable/all.dis
          readelf -rW "$SO" > /tmp/restrictions-vtable/relocs.txt
          python3 - <<'PY' > analysis/restrictions-bundle-vtable.md
          from pathlib import Path
          import re, bisect

          dis = Path('/tmp/restrictions-vtable/all.dis').read_text(errors='replace').splitlines()
          rel_txt = Path('/tmp/restrictions-vtable/relocs.txt').read_text(errors='replace').splitlines()

          ins=[]; labels=[]
          for i,line in enumerate(dis):
              lm=re.match(r'^([0-9a-f]+)\s+<([^>]+)>:', line)
              if lm:
                  labels.append((int(lm.group(1),16), i, lm.group(2), line))
              m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$', line)
              if m:
                  ins.append((int(m.group(1),16), i, m.group(2), line))
          addrs=[x[0] for x in ins]
          lab_addrs=[x[0] for x in labels]

          def idx(a): return bisect.bisect_left(addrs,a)
          def label_for(a):
              if a is None: return ''
              j=bisect.bisect_right(lab_addrs,a)-1
              return labels[j][2] if j>=0 else ''
          def ctx(a,b=16,af=48):
              j=idx(a)
              return '\n'.join('    '+ins[k][3] for k in range(max(0,j-b), min(len(ins), j+af+1)))
          def md(s): return str(s).replace('|','\\|').replace('\n',' ')
          def split_ops(op):
              parts=op.split(None,1)
              if len(parts)<2: return (parts[0] if parts else '', [])
              mn,rest=parts
              vals=[]; cur=''; depth=0
              for ch in rest:
                  if ch=='[': depth+=1
                  elif ch==']': depth-=1
                  if ch==',' and depth==0:
                      vals.append(cur.strip()); cur=''
                  else:
                      cur+=ch
              if cur.strip(): vals.append(cur.strip())
              return mn, vals
          def norm(a): return re.sub(r'^(BYTE|WORD|DWORD|QWORD|XMMWORD|YMMWORD) PTR\s+','',a).strip()
          def mem(arg):
              m=re.search(r'\[([a-z0-9]+)(?:([+-])0x([0-9a-f]+))?\]', arg)
              if not m: return None
              off=int(m.group(3) or '0',16)
              if m.group(2)=='-': off=-off
              return (m.group(1), off)

          relocs={}
          rel_sym={}
          for line in rel_txt:
              # Typical: 000000000187e3c8  0000000000000008 R_X86_64_RELATIVE                    123456
              m=re.match(r'\s*([0-9a-fA-F]+)\s+\S+\s+(R_X86_64_[A-Z0-9_]+)\s*(.*)$', line)
              if not m: continue
              off=int(m.group(1),16); typ=m.group(2); tail=m.group(3).strip()
              if typ == 'R_X86_64_RELATIVE':
                  hm=re.search(r'([0-9a-fA-F]+)$', tail)
                  if hm:
                      relocs[off]=int(hm.group(1),16)
                      rel_sym[off]=tail
              else:
                  # Keep non-relative rows for diagnostics; sometimes vtables use symbolic absolute relocations.
                  hm=re.search(r'([0-9a-fA-F]{4,})', tail)
                  if hm:
                      relocs.setdefault(off,int(hm.group(1),16))
                      rel_sym.setdefault(off,typ+' '+tail)
                  else:
                      rel_sym.setdefault(off,typ+' '+tail)

          regs=['rax','rbx','rcx','rdx','rsi','rdi','rbp','rsp','r8','r9','r10','r11','r12','r13','r14','r15']
          argregs=['rdi','rsi','rdx','rcx','r8','r9']
          subregs={
              'eax':'rax','ebx':'rbx','ecx':'rcx','edx':'rdx','esi':'rsi','edi':'rdi','ebp':'rbp','esp':'rsp',
              'r8d':'r8','r9d':'r9','r10d':'r10','r11d':'r11','r12d':'r12','r13d':'r13','r14d':'r14','r15d':'r15',
              'al':'rax','bl':'rbx','cl':'rcx','dl':'rdx','sil':'rsi','dil':'rdi',
          }
          def canonical_reg(r): return subregs.get(r,r)

          def analyze_method(target, max_bytes=0x520):
              if target is None:
                  return [], [], [], [], []
              body=[x for x in ins if target <= x[0] < target+max_bytes]
              st={r:None for r in regs}
              for r in argregs: st[r]=f'arg:{r}'
              refs=[]; writes=[]; calls=[]; rets=[]
              for a,i,op,line in body:
                  mn,ops=split_ops(op)
                  for arg in ops:
                      b=mem(arg)
                      base=canonical_reg(b[0]) if b else None
                      if b and st.get(base):
                          desc=st[base] + (f'{b[1]:+x}' if b[1] else '')
                          refs.append((a,desc,line))
                          if ops and norm(ops[0])==norm(arg) and mn not in ('cmp','test'):
                              writes.append((a,desc,line))
                  if mn=='call':
                      calls.append((a,{r:st.get(r) for r in argregs if st.get(r)},line))
                  if mn.startswith('ret'):
                      rets.append((a,line))
                      # keep scanning in case linear body includes tail blocks, but record it
                  if not ops: continue
                  dst=norm(ops[0]); dst_reg=canonical_reg(dst) if canonical_reg(dst) in regs else None
                  if mn=='lea' and dst_reg and len(ops)>1:
                      b=mem(ops[1]); base=canonical_reg(b[0]) if b else None
                      if b and st.get(base): st[dst_reg]=st[base] + (f'{b[1]:+x}' if b[1] else '')
                      else: st[dst_reg]=None
                  elif mn=='mov' and dst_reg and len(ops)>1:
                      src=norm(ops[1]); src_reg=canonical_reg(src)
                      if src_reg in regs and st.get(src_reg):
                          st[dst_reg]=st[src_reg]
                      else:
                          b=mem(src); base=canonical_reg(b[0]) if b else None
                          st[dst_reg]=(f'load({st[base]}{b[1]:+x})' if b and st.get(base) else None)
                  elif dst_reg and mn not in ('cmp','test'):
                      st[dst_reg]=None
              return body, refs, writes, calls, rets

          # vptr AP proven in previous slice: [rsp+0x2e0] = 0x187e3c8.
          ap=0x187e3c8
          offsets=[-0x20,-0x18,-0x10,-0x8,0x0,0x8,0x10,0x18,0x20,0x28,0x30,0x38,0x40,0x48,0x50,0x58,0x60]
          entries=[]
          for off in offsets:
              addr=ap+off
              val=relocs.get(addr)
              entries.append((off, addr, val, label_for(val), rel_sym.get(addr,'')))

          print('# Restrictions bundle vtable trace')
          print()
          print('Purpose: resolve the vptr stored into `[rsp+0x2e0]` and inspect the methods called by `166103c`.')
          print()
          print('## Proven vptr materialization')
          print('```text')
          print('14ce65f  lea rax, [rip+...]  # 0x187e3c8')
          print('14ce666  lea rcx, [rsp+0x310]')
          print('14ce66e  mov [rcx-0x30], rax   ; [rsp+0x2e0] = 0x187e3c8')
          print('```')
          print()
          print('## Vtable/address-point entries around `0x187e3c8`')
          print('| offset from AP | entry address | resolved target | label | relocation tail |')
          print('|---:|---:|---:|---|---|')
          for off,addr,val,lab,sym in entries:
              vt=f'`0x{val:x}`' if val is not None else '`?`'
              print(f'| `{off:+#x}` | `0x{addr:x}` | {vt} | `{md(lab)}` | `{md(sym)}` |')
          print()
          call_offsets=[0x10,0x18,0x30]
          print('## Methods reached from `166103c`')
          print('| callsite in 166103c | vtable offset | method target | label |')
          print('|---:|---:|---:|---|')
          for off in call_offsets:
              val=relocs.get(ap+off)
              callsite={0x10:0x1661089,0x30:0x1661095,0x18:0x16610a2}[off]
              vt=f'`0x{val:x}`' if val is not None else '`?`'
              print(f'| `0x{callsite:x}` | `+0x{off:x}` | {vt} | `{md(label_for(val))}` |')
          print()
          for off in call_offsets:
              target=relocs.get(ap+off)
              print(f'## Method vtable `+0x{off:x}` target `{("0x%x" % target) if target else "?"}`')
              if target is None:
                  print('- target could not be resolved from relocation table')
                  print()
                  continue
              print(f'- label: `{md(label_for(target))}`')
              body, refs, writes, calls, rets = analyze_method(target)
              print(f'- instructions scanned: `{len(body)}`')
              print(f'- arg-memory refs: `{len(refs)}`')
              print(f'- arg-derived writes/calls: `{len(writes)}`')
              print(f'- calls: `{len(calls)}`')
              print(f'- returns in window: `{len(rets)}`')
              print()
              print('### Entry body excerpt')
              print('```text')
              for aa,i,op,line in body[:90]:
                  print('    '+line)
              if len(body)>90: print(f'    ... truncated {len(body)-90} additional instructions ...')
              print('```')
              print()
              print('### Arg-memory refs')
              if refs:
                  print('| addr | arg-derived location | instruction |')
                  print('|---|---|---|')
                  for a,desc,line in refs[:80]: print(f'| `0x{a:x}` | `{md(desc)}` | `{md(line.strip())}` |')
                  if len(refs)>80: print(f'| ... | ... | truncated {len(refs)-80} rows |')
              else:
                  print('- none')
              print()
              print('### Arg-derived writes / indirect calls')
              if writes:
                  print('| addr | arg-derived location | instruction |')
                  print('|---|---|---|')
                  for a,desc,line in writes[:80]: print(f'| `0x{a:x}` | `{md(desc)}` | `{md(line.strip())}` |')
                  if len(writes)>80: print(f'| ... | ... | truncated {len(writes)-80} rows |')
              else:
                  print('- none')
              print()
              print('### Calls inside method')
              if calls:
                  print('| call | tracked args | instruction |')
                  print('|---|---|---|')
                  for a,arg_state,line in calls[:70]:
                      txt=', '.join(f'{k}={v}' for k,v in arg_state.items())
                      print(f'| `0x{a:x}` | `{md(txt)}` | `{md(line.strip())}` |')
                  if len(calls)>70: print(f'| ... | ... | truncated {len(calls)-70} rows |')
              else:
                  print('- none')
              print()
          print('## Interpretation')
          print('- `+0x30` is the dispatch used at `1661095` after building a local descriptor whose `+0x8` points to the post-`17add2a` object.')
          print('- If the resolved `+0x30` method writes through `arg:rdi+0x30`, that closes the source of the Restrictions factory `rdx+0x30` read.')
          print('- If it only delegates to another virtual/helper call, the next trace should follow that method-specific call rather than the generic string helpers.')
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/restrictions-bundle-vtable.md
          git diff --cached --quiet && exit 0
          git commit -m "Trace Restrictions bundle vtable"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1
name: Trace Restrictions open paths parallel v2

on:
  push:
    paths:
      - '.github/workflows/trace-restrictions-parallel-open-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download r1 --repo Persie0/spotify --pattern 'spotify-9-1-84-2205.apk' --clobber
          unzip -p spotify-9-1-84-2205.apk lib/x86_64/liborbit-jni-spotify.so > liborbit-jni-spotify.so

      - name: Generate parallel open-path reports
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path

          so='liborbit-jni-spotify.so'
          out=Path('analysis'); out.mkdir(exist_ok=True)
          dis=subprocess.check_output(['objdump','-d','-M','intel',so], text=True, errors='replace')
          insn_re=re.compile(r'^\s*([0-9a-f]+):\s+((?:[0-9a-f]{2}\s)+)\s*(.*)$')
          insns=[]
          for line in dis.splitlines():
              m=insn_re.match(line)
              if m: insns.append((int(m.group(1),16), line.rstrip(), m.group(3).strip()))
          addrs=[a for a,_,_ in insns]
          def ni(addr):
              lo,hi=0,len(addrs)-1
              while lo<hi:
                  mid=(lo+hi)//2
                  if addrs[mid]<addr: lo=mid+1
                  else: hi=mid
              return lo
          def win(start,end): return [(a,l,t) for a,l,t in insns if start<=a<=end]
          def around(addr,b=14,aft=90):
              i=ni(addr); return insns[max(0,i-b):min(len(insns),i+aft)]
          def fmt(rows): return '```text\n'+'\n'.join(l for _,l,_ in rows)+'\n```\n'
          def table(rows,limit=420):
              s='| addr | instruction |\n|---:|---|\n'
              for a,l,t in rows[:limit]: s+=f'| `{a:#x}` | `{l.strip()}` |\n'
              if len(rows)>limit: s+=f'| ... | truncated {len(rows)-limit} more |\n'
              return s+'\n'
          def xrefs(terms,limit=20):
              d={k:[] for k in terms}
              for i,(a,l,t) in enumerate(insns):
                  for k in terms:
                      if k in l:
                          d[k].append((a,max(0,i-6),min(len(insns),i+12)))
              md=[]
              for k,hits in d.items():
                  md.append(f'### `{k}` hits ({len(hits)})\n\n')
                  for a,s,e in hits[:limit]:
                      md.append(f'#### hit `{a:#x}`\n\n')
                      md.append(fmt(insns[s:e]))
                  if len(hits)>limit: md.append(f'... truncated {len(hits)-limit} more ...\n\n')
              return ''.join(md)

          # Report 1: tail after wrapper_0xd8.
          tail=win(0x10ac4e0,0x10ac980)
          tail_pats=['rsp+0x70','184d9a8','184d0a0','184d1f0','call','0xd8','+0x18','+0x20','+0x28','+0x70','+0x78','b411a4','184da88','184ca90']
          tail_inter=[x for x in tail if any(p in x[1] for p in tail_pats) or re.search(r'mov\s+QWORD PTR \[[^\]]+\],',x[2])]
          md=['# Restrictions constructor tail after wrapper_0xd8 v2\n\n']
          md.append('Rebased combined run. Follows `[rsp+0x70]`, `wrapper_0xd8 / AP 0x184d9a8`, and later constructor-tail stores.\n\n')
          md.append('## Tail `10ac4e0..10ac980` interesting events\n\n'+table(tail_inter))
          for addr,desc in [(0x10ac4e4,'second [rsp+0x40] vtable+0x28 call'),(0x10ac4f7,'operator new(0xd8)'),(0x10ac503,'AP 0x184d9a8 store'),(0x10ac51b,'post wrapper_0xd8 continuation'),(0x10ac5da,'fallback branch'),(0x10ac487,'join from wrapper_0x80/fallback holder')]:
              md.append(f'## `{addr:#x}` — {desc}\n\n'+fmt(around(addr)))
          md.append('## Targeted xrefs\n\n'+xrefs(['184d9a8','184d0a0','184d1f0','rsp+0x70','b411a4','184da88','184ca90']))
          Path('analysis/restrictions-tail-after-wrapperd8-v2.md').write_text(''.join(md),encoding='utf-8')

          # Report 2: frame provenance.
          ctor=win(0x10aba36,0x10adc80)
          md=['# Restrictions constructor frame provenance v2\n\n']
          md.append('Rebased combined run for `[rsp+0x40]`, `r15`, and `[rsp+0x70]` provenance.\n\n')
          for name,pats in {
              'rsp+0x40':['rsp+0x40'], 'rsp+0x70':['rsp+0x70'], 'rsp+0x28':['rsp+0x28'], 'rsp+0x60':['rsp+0x60'], 'rsp+0x80':['rsp+0x80'], 'rsp+0x110':['rsp+0x110'],
              'r15':['r15','r15d'], 'r14':['r14','r14d'], 'r13':['r13','r13d'], 'r12':['r12','r12d'], 'rbp':['rbp','ebp']
          }.items():
              rows=[x for x in ctor if any(p in x[1] for p in pats)]
              md.append(f'## `{name}` refs ({len(rows)})\n\n'+table(rows,260))
          events=[x for x in ctor if any(p in x[1] for p in ['call','rsp+0x40','rsp+0x70','rsp+0x28','rsp+0x60','rsp+0x80','rsp+0x110','r15','184d0a0','184d9a8','184d1f0','184d898','184d808','187e260'])]
          md.append('## Chronological combined event stream\n\n'+table(events,520))
          Path('analysis/restrictions-frame-provenance-v2.md').write_text(''.join(md),encoding='utf-8')

          # Report 3: child18 side.
          md=['# Restrictions child+0x18 / b411a4 parallel trace v2\n\n']
          md.append('Rebased combined run for the direct child/service side while constructor-tail wrapper tracing runs.\n\n')
          for addr,desc in [(0xb411a4,'b411a4 returns [child+0x18]'),(0x184da88,'child AP/literal'),(0x184ca90,'service AP/literal'),(0x10aba36,'constructor'),(0x10ab97f,'factory call into constructor')]:
              md.append(f'## `{addr:#x}` — {desc}\n\n'+fmt(around(addr)))
          md.append('## Targeted child/service xrefs\n\n'+xrefs(['b411a4','184da88','184ca90','10aba36','10ab97f'],24))
          child_related=[x for x in insns if any(k in x[1] for k in ['b411a4','184da88','184ca90']) or '[rdi+0x18]' in x[1] or 'QWORD PTR [rdi+0x18]' in x[1]]
          ctor18=[x for x in ctor if any(p in x[1] for p in ['+0x18','+0x10','+0x20'])]
          md.append('## Child/service related direct hits\n\n'+table(child_related,340))
          md.append('## Constructor +0x18/+0x10/+0x20 activity\n\n'+table(ctor18,520))
          Path('analysis/restrictions-child18-parallel-v2.md').write_text(''.join(md),encoding='utf-8')

          print('wrote v2 reports')
          PY

      - name: Commit reports
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/restrictions-tail-after-wrapperd8-v2.md analysis/restrictions-frame-provenance-v2.md analysis/restrictions-child18-parallel-v2.md
          git commit -m 'Trace Restrictions open paths in rebased batch' || exit 0
          git pull --rebase origin main
          git push
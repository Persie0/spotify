name: Decode smart skip target source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decode-smart-skip-target.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/smartskip
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/smartskip
      - name: Install helper
        run: python3 -m pip install --quiet pyelftools
      - name: Decode target source
        run: |
          SO=/tmp/smartskip/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/smartskip/all.dis
          python3 - <<'PY' > analysis/timeline-smart-skip-target.md
          from pathlib import Path
          import re,bisect
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/smartskip/liborbit-jni-spotify.so')
          data=so.read_bytes()
          dl=Path('/tmp/smartskip/all.dis').read_text(errors='replace').splitlines()
          with so.open('rb') as f:
              elf=ELFFile(f)
              loads=[]
              for s in elf.iter_segments():
                  if s['p_type']=='PT_LOAD':
                      loads.append((s['p_offset'],s['p_offset']+s['p_filesz'],s['p_vaddr']))
              dwarf=elf.get_dwarf_info()
              fdes=[]
              for e in dwarf.EH_CFI_entries():
                  if isinstance(e,FDE):
                      a=e['initial_location']; z=a+e['address_range']
                      if z>a:fdes.append((a,z))
          fdes.sort(); starts=[a for a,z in fdes]
          ins=[]
          for i,l in enumerate(dl):
              m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
              if m:ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]

          def fde(a):
              k=bisect.bisect_right(starts,a)-1
              if k>=0 and fdes[k][0]<=a<fdes[k][1]:return fdes[k]
          def body(a,cap=3000):
              fr=fde(a)
              if not fr:return []
              j=bisect.bisect_left(addrs,fr[0]);out=[]
              for x in ins[j:]:
                  if x[0]>=fr[1]:break
                  out.append(x)
                  if len(out)>=cap:break
              return out
          def vaoff(v):
              for po,pe,pv in loads:
                  if pv<=v<pv+(pe-po):return po+(v-pv)
          def cstr(v,lim=512):
              o=vaoff(v)
              if o is None:return None
              e=data.find(b'\0',o,min(len(data),o+lim))
              if e<0:return None
              try:return data[o:e].decode('utf8')
              except:return None

          funcs=[
              (0x1367944,'current/active item getter'),
              (0x1393c2a,'candidate metadata decode/check'),
              (0x13933de,'time ratio/source'),
              (0x13a1a4a,'first smart-skip boundary lookup'),
              (0x13a392c,'second smart-skip boundary lookup'),
              (0x137cb68,'seek implementation'),
              (0x13825fa,'post-seek/report helper'),
              (0x1382662,'post-seek state builder')
          ]

          print('# Timeline smart-skip target source')
          print()
          print('Known +0x68 control flow:')
          print('- 0x1371d90 = smartSkipEmbeddedPodcastAd')
          print('- computes r14 in milliseconds')
          print('- tries 0x13a1a4a, then 0x13a392c to replace/refine r14')
          print('- calls 0x137cb68(this, r14, 0, 0, 1)')
          print()

          for fn,label in funcs:
              print(f'## {label}: 0x{fn:x} FDE={fde(fn)}')
              rows=body(fn)
              strings=[]
              for a,i,op,l in rows:
                  print('    '+l)
                  m=re.search(r'#\s*([0-9a-f]+)\b',l)
                  if m:
                      v=int(m.group(1),16);s=cstr(v)
                      if s and 2<=len(s)<=250 and s not in strings:strings.append(s)
              if strings:
                  print('- strings:')
                  for s in strings:print(f'  - {s!r}')
              print()

          print('## Exact caller-side target calculation in 0x1371d90')
          for a,i,op,l in body(0x1371d90):
              if 0x1371e30<=a<=0x1371f40:
                  print(l)
          print()

          print('## Direct callers of boundary lookup helpers')
          for t in (0x13a1a4a,0x13a392c):
              print(f'### target 0x{t:x}')
              for a,i,op,l in ins:
                  if re.search(r'call\s+'+format(t,'x')+r'\b',op):
                      fr=fde(a)
                      print(f'- caller 0x{a:x} FDE={fr}')
                      j=bisect.bisect_left(addrs,a)
                      for x in ins[max(0,j-12):min(len(ins),j+20)]:print('    '+x[3])
              print()
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/timeline-smart-skip-target.md
          git diff --cached --quiet && exit 0
          git commit -m "Decode smart skip target source"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main &&
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

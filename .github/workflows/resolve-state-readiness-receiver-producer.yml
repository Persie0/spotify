name: Resolve state readiness receiver producer

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/resolve-state-readiness-receiver-producer.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/stateprod
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/stateprod
      - name: Dump exact producer window
        run: |
          SO=/tmp/stateprod/liborbit-jni-spotify.so
          {
            echo '# State readiness receiver producer'
            echo
            echo 'Target: e9ccf3 stores [rsp+0x770] into state+0x10.'
            echo
            echo '## Exact window e9c780..e9cd20'
            objdump -d -M intel --start-address=0xe9c780 --stop-address=0xe9cd20 "$SO"
            echo
            echo '## rsp+0x770 / rsp+0x1338 / alias-related instructions'
            objdump -d -M intel --start-address=0xe9b000 --stop-address=0xe9cd20 "$SO" | grep -E -B14 -A22 '0x(770|778|780|1338|1330|1310)' | head -n 16000 || true
            echo
            echo '## Calls in final producer window'
            objdump -d -M intel --start-address=0xe9c780 --stop-address=0xe9cd20 "$SO" | grep -E 'call|jmp[[:space:]]+QWORD' || true
            echo
            echo '## High-address constants / candidate vptrs'
            objdump -d -M intel --start-address=0xe9c780 --stop-address=0xe9cd20 "$SO" | grep -E '# 18[0-9a-f]{5,}|# 19[0-9a-f]{5,}' || true
          } > analysis/state-readiness-receiver-producer.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/state-readiness-receiver-producer.md
          git diff --cached --quiet && exit 0
          git commit -m "Resolve state readiness receiver producer"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

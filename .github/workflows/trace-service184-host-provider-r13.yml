name: Trace service184 host provider r13

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trace-service184-host-provider-r13.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/s184r13
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/s184r13
      - name: Trace r13
        run: |
          set -euo pipefail
          SO=/tmp/s184r13/liborbit-jni-spotify.so
          objdump -d -M intel --start-address=0xdda4fa --stop-address=0xddac40 "$SO" > /tmp/s184r13/region.dis
          python3 - <<'PY' > analysis/service184-host-provider-r13.md
          from pathlib import Path
          import re
          L=Path('/tmp/s184r13/region.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(L):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m: ins.append((int(m.group(1),16),i,m.group(2),l))
          print('# Service184 host +0x30 provider r13 trace')
          print()
          print('Final sink: ddac2b stores r13 to host+0x30.')
          print()
          print('## Every instruction that writes r13 before sink')
          for k,(a,i,op,l) in enumerate(ins):
            if a>0xddac2b: break
            # destination register r13/r13d/r13b or pop r13
            dest=False
            if re.match(r'[^ ]+\s+r13(?:d|b|w)?(?:,|$)',op): dest=True
            if re.match(r'pop\s+r13\b',op): dest=True
            if dest:
              print(f'### 0x{a:x}: {op}')
              for x in L[max(0,i-12):min(len(L),i+14)]: print('    '+x)
              print()
          print('## Every call and immediately following register moves')
          for k,(a,i,op,l) in enumerate(ins):
            if a>0xddac2b:break
            if re.search(r'\bcall\b',op):
              print(f'### 0x{a:x}: {op}')
              for x in L[max(0,i-4):min(len(L),i+9)]:print('    '+x)
              print()
          print('## Last 0x180 bytes before ddac2b')
          for a,i,op,l in ins:
            if 0xddaaab<=a<=0xddac35: print(l)
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/service184-host-provider-r13.md
          git diff --cached --quiet && exit 0
          git commit -m "Trace service184 host provider r13"
          git pull --rebase origin main
          git push origin HEAD:main

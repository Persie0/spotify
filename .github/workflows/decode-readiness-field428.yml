name: Decode readiness field 428 object

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decode-readiness-field428.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/f428
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/f428
      - name: Decode
        run: |
          SO=/tmp/f428/liborbit-jni-spotify.so
          {
            echo '# Readiness source at owner+0x428'
            echo
            echo '## Exact construction around ecee52'
            objdump -d -M intel --start-address=0xeced00 --stop-address=0xeceee0 "$SO"
            echo
            echo '## Exact caller source around e95a7d'
            objdump -d -M intel --start-address=0xe95980 --stop-address=0xe95b10 "$SO"
            echo
            echo '## ecee FDE prologue neighborhood'
            objdump -d -M intel --start-address=0xece57c --stop-address=0xece720 "$SO"
          } > analysis/readiness-field428-object.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions-bot@users.noreply.github.com"
          git add analysis/readiness-field428-object.md
          git diff --cached --quiet && exit 0
          git commit -m "Decode readiness field 428 object"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

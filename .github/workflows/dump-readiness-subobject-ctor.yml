name: Dump readiness subobject ctor

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dump-readiness-subobject-ctor.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/subraw
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/subraw
      - name: Dump
        run: |
          {
            echo '# Readiness subobject constructor raw'
            echo
            echo 'Callsite: rdi = readiness-object base+0x20; call 0xf419b4.'
            echo
            objdump -d -M intel --start-address=0xf419b4 --stop-address=0xf41c40 /tmp/subraw/liborbit-jni-spotify.so
          } > analysis/skip-ad-readiness-subobject-raw.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/skip-ad-readiness-subobject-raw.md
          git diff --cached --quiet && exit 0
          git commit -m "Dump readiness subobject ctor"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

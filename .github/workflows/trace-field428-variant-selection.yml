name: Trace field428 variant selection

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trace-field428-variant-selection.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/f428variant
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/f428variant

      - name: Install helper
        run: python3 -m pip install --quiet pyelftools

      - name: Trace variant selection
        run: |
          set -euo pipefail
          SO=/tmp/f428variant/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/f428variant/all.dis
          python3 - <<'PY' > analysis/field428-variant-selection.md
          from pathlib import Path
          import re,bisect
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          lines=Path('/tmp/f428variant/all.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(lines):
              m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
              if m: ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]

          with open('/tmp/f428variant/liborbit-jni-spotify.so','rb') as f:
              elf=ELFFile(f); dwarf=elf.get_dwarf_info(); fdes=[]
              for e in dwarf.EH_CFI_entries():
                  if isinstance(e,FDE):
                      a=e['initial_location']; z=a+e['address_range']
                      if z>a:fdes.append((a,z))
          fdes.sort(); starts=[a for a,z in fdes]

          def fde(a):
              k=bisect.bisect_right(starts,a)-1
              if k>=0 and fdes[k][0]<=a<fdes[k][1]: return fdes[k]
          def idx(a): return bisect.bisect_left(addrs,a)
          def ctx(a,b=14,n=28):
              j=idx(a)
              return '\n'.join('    '+x[3] for x in ins[max(0,j-b):min(len(ins),j+n+1)])
          def body(fr):
              j=idx(fr[0]); out=[]
              for x in ins[j:]:
                  if x[0]>=fr[1]: break
                  out.append(x)
              return out

          a1=0xe9ff24
          a2=0xea01e4
          fr=fde(a1)
          print('# field428 readiness-source variant selection')
          print()
          print('Proven sibling source APs:')
          print('- 0x1834418: +0x30 -> 0xee6db8')
          print('- 0x1834728: +0x30 -> 0xece084')
          print('- both share +0x20 -> 0xece064 and +0x28 -> 0xece06e')
          print()
          print(f'Both materializations are inside FDE={fr}')
          print()

          rows=body(fr) if fr else []

          print('## Exact first variant materialization @0xe9ff24')
          print(ctx(a1,45,120)); print()
          print('## Exact second variant materialization @0xea01e4')
          print(ctx(a2,80,120)); print()

          print('## Control-flow instructions between the two materializations')
          for a,i,op,l in rows:
              if a1-0x180 <= a <= a2+0x80 and re.match(r'(j\w+|cmp|test|cmov\w+|set\w+)',op):
                  print('    '+l)
          print()

          slots=[0x770,0x778,0x780,0x788,0x790,0x798,0x1060,0x1068,0x1070,0x1078,0x1080,0x1088]
          print('## All exact source-stack references in containing FDE')
          for off in slots:
              pat=f'rsp+0x{off:x}]'
              hits=[x for x in rows if pat in x[2]]
              print(f'### rsp+0x{off:x}: {len(hits)} refs')
              for a,i,op,l in hits:
                  print(f'- 0x{a:x}: {op}')
              print()

          print('## Nearest writes before each source block use')
          uses={0x770:a1,0x780:a1,0x790:a1,0x1060:a2,0x1070:a2,0x1080:a2}
          for off,use in uses.items():
              pat=f'rsp+0x{off:x}]'
              cand=[]
              for a,i,op,l in rows:
                  if a>=use: break
                  if pat not in op: continue
                  lhs=op.split(',',1)[0]
                  if pat in lhs:
                      cand.append((a,i,op,l))
              print(f'### rsp+0x{off:x} before 0x{use:x}')
              for a,i,op,l in cand[-8:]:
                  print(f'#### write 0x{a:x}: {op}')
                  print(ctx(a,10,18))
              print()

          print('## References to TimelineAds owner+0x50 vtables in same FDE')
          for ap in (0x18674c8,0x1867550,0x1867980,0x18678f8):
              hits=[]
              needle=f'# {ap:x}'
              for a,i,op,l in rows:
                  if needle in l: hits.append((a,i,op,l))
              print(f'### AP 0x{ap:x}: {len(hits)} refs')
              for a,i,op,l in hits:
                  print(f'#### 0x{a:x}')
                  print(ctx(a,10,18))
              print()

          print('## Registry/service-ID 0xb7 looking call sites in same FDE')
          # Heuristic: instructions materializing 0xb7, plus nearby calls.
          for k,(a,i,op,l) in enumerate(rows):
              if re.search(r'\b(?:mov|push)\b[^\n]*\b0xb7\b',op):
                  print(f'### 0x{a:x}: {op}')
                  for x in rows[max(0,k-12):min(len(rows),k+24)]: print('    '+x[3])
                  print()

          print('## Calls to known TimelineAds getter 0xaa712a / registry helper b622de')
          for a,i,op,l in rows:
              if re.search(r'\b(?:call|jmp)\s+(?:aa712a|b622de)\b',op):
                  print(f'### 0x{a:x}: {op}')
                  print(ctx(a,14,24)); print()

          print('## Stack-source definitions with high-address/vptr materializations')
          for use in (a1,a2):
              print(f'### preceding 0x400 bytes before 0x{use:x}')
              for a,i,op,l in rows:
                  if use-0x400 <= a < use and re.search(r'#\s*18[0-9a-f]{5,}\b',l):
                      print('    '+l)
              print()

          print('## Branch predecessors targeting variant neighborhoods')
          for target_lo,target_hi,name in [
              (a1-0x40,a1+0x40,'variant-1834418'),
              (a2-0x40,a2+0x40,'variant-1834728')
          ]:
              print(f'### {name}')
              for a,i,op,l in rows:
                  m=re.search(r'\b(j\w+)\s+([0-9a-f]+)\b',op)
                  if not m: continue
                  dst=int(m.group(2),16)
                  if target_lo<=dst<=target_hi:
                      print(f'- 0x{a:x}: {op}')
                      print(ctx(a,10,16))
              print()
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/field428-variant-selection.md
          git diff --cached --quiet && exit 0
          git commit -m "Trace field428 variant selection"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

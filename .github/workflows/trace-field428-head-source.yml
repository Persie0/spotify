name: Trace field428 head source argument

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trace-field428-head-source.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/fh
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/fh
      - name: Install helper
        run: python3 -m pip install --quiet pyelftools
      - name: Trace caller arg
        run: |
          SO=/tmp/fh/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/fh/all.dis
          python3 - <<'PY' > analysis/field428-head-source.md
          from pathlib import Path
          import re,bisect
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE
          lines=Path('/tmp/fh/all.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(lines):
              m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
              if m: ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]
          with open('/tmp/fh/liborbit-jni-spotify.so','rb') as f:
              elf=ELFFile(f); dwarf=elf.get_dwarf_info(); fdes=[]
              for e in dwarf.EH_CFI_entries():
                  if isinstance(e,FDE):
                      a=e['initial_location'];z=a+e['address_range']
                      if z>a:fdes.append((a,z))
          fdes.sort();starts=[a for a,z in fdes]
          def fde(a):
              k=bisect.bisect_right(starts,a)-1
              if k>=0 and fdes[k][0]<=a<fdes[k][1]:return fdes[k]
          def idx(a):return bisect.bisect_left(addrs,a)
          def body(fr):
              j=idx(fr[0]);out=[]
              for x in ins[j:]:
                  if x[0]>=fr[1]:break
                  out.append(x)
              return out
          def ctx(rows,k,b=80,n=30):
              for x in rows[max(0,k-b):min(len(rows),k+n+1)]:print('    '+x[3])

          target=0xece57c
          fr=fde(target)
          print('# field428 head source argument')
          print()
          print(f'- constructor FDE={fr}')
          print('- prologue: six pushes + sub rsp,0x168 => post rsp = entry_rsp-0x198')
          print('- [rsp+0x1c8] = entry_rsp+0x30')
          print('- [rsp+0x1d0] = entry_rsp+0x38')
          print('- [rsp+0x1d8] = entry_rsp+0x40')
          print('- caller pre-call rsp = entry_rsp+8')
          print('- therefore source head [rsp+0x1c8] = caller pre-call [rsp+0x28]')
          print()
          callers=[]
          for a,i,op,l in ins:
              if re.search(r'\bcall\s+ece57c\b',op):
                  cf=fde(a); callers.append((a,cf))
          print(f'## Direct callers ({len(callers)})')
          for call,cf in callers:
              cr=body(cf);ck=next(k for k,x in enumerate(cr) if x[0]==call)
              print(f'### call 0x{call:x}; FDE={cf}')
              ctx(cr,ck,120,30);print()

          print('## Map caller pre-call +0x28 source')
          for call,cf in callers:
              cr=body(cf);ck=next(k for k,x in enumerate(cr) if x[0]==call)
              # Inspect last ~80 instructions, track pushes backwards.
              bytes_after=0; mapped=[]
              for k in range(ck-1,max(-1,ck-120),-1):
                  a,i,op,l=cr[k]
                  if re.match(r'push\b',op):
                      operand=re.match(r'push\s+(.+)',op).group(1)
                      mapped.append((bytes_after,a,operand,k))
                      bytes_after+=8
                      if bytes_after>=0x80:break
              for slot,a,operand,k in sorted(mapped):
                  mark=' <== source head' if slot==0x28 else ''
                  print(f'- +0x{slot:x}: 0x{a:x} push {operand}{mark}')
              chosen=[x for x in mapped if x[0]==0x28]
              if chosen:
                  slot,a,operand,k=chosen[0]
                  print(f'### selected source @0x{a:x}: {operand}')
                  ctx(cr,k,50,20)
                  print()

          print('## Constructor incoming source usage')
          rows=body(fr)
          for off in ('0x1c8','0x1d0','0x1d8'):
              print(f'### {off}')
              for k,(a,i,op,l) in enumerate(rows):
                  if f'rsp+{off}' in op:
                      print(f'- 0x{a:x}: {op}')
                      ctx(rows,k,8,14)
              print()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/field428-head-source.md
          git diff --cached --quiet && exit 0
          git commit -m "Trace field428 head source"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

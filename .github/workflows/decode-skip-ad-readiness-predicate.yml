name: Decode Skip Ad readiness predicate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decode-skip-ad-readiness-predicate.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/pred
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/pred
      - name: Decode predicate
        run: |
          set -euo pipefail
          SO=/tmp/pred/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/pred/all.dis
          {
            echo '# Skip Ad readiness predicate fb1b50'
            echo
            echo 'Proven dispatch:'
            echo '- available-signals fd381a loads receiver and calls vtable +0x140'
            echo '- concrete receiver final AP = 0x183ba50'
            echo '- 0x183ba50 + 0x140 -> 0xfb1b50'
            echo '- adapter AP 0x1841fc0 also maps +0x140 -> 0xfb1b50'
            echo
            echo '## Predicate body'
            objdump -d -M intel --start-address=0xfb1b50 --stop-address=0xfb1c80 "$SO"
            echo
            echo '## Nearby family'
            objdump -d -M intel --start-address=0xfb1908 --stop-address=0xfb1fc0 "$SO"
            echo
            echo '## Direct callers / vtable refs'
            grep -n -E -B12 -A20 'fb1b50|183bb90|1842100' /tmp/pred/all.dis || true
          } > analysis/skip-ad-readiness-predicate.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/skip-ad-readiness-predicate.md
          git diff --cached --quiet && exit 0
          git commit -m "Decode Skip Ad readiness predicate"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

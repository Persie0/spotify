name: Trace d8a5c2 receiver source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trace-d8a5c2-receiver-source.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/d8src
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/d8src

      - name: Trace source
        run: |
          SO=/tmp/d8src/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/d8src/all.dis
          {
            echo '# d8a5c2 receiver source'
            echo
            echo 'Known: d8a488 clones source rsp+0x160; source[0] becomes carrier[0]; d8a5c2 loads receiver=carrier[0] and calls receiver vtable +0x1d8.'
            echo
            echo '## Full caller FDE d85524..d85885'
            objdump -d -M intel --start-address=0xd85524 --stop-address=0xd85885 "$SO"
            echo
            echo '## Exact rsp+0x160 references'
            grep -n -E -B24 -A35 'rsp\+0x160' /tmp/d8src/all.dis | sed -n '/d85524/,/d85885/p' || true
            echo
            echo '## Writes covering rsp+0x160..0x180 in caller FDE'
            objdump -d -M intel --start-address=0xd85524 --stop-address=0xd85885 "$SO" | grep -E '\[rsp\+0x1(60|68|70|78|80)\]' || true
            echo
            echo '## Potential producer calls before first d8a488'
            objdump -d -M intel --start-address=0xd85524 --stop-address=0xd85619 "$SO" | grep -E -B12 -A18 'call[[:space:]]+' || true
            echo
            echo '## Receiver-vptr consumers via +0x1d8 in this FDE'
            objdump -d -M intel --start-address=0xd85524 --stop-address=0xd85885 "$SO" | grep -E -B18 -A28 'call[[:space:]]+QWORD PTR \[[^]]+\+0x1d8\]' || true
          } > analysis/d8a5c2-receiver-source.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/d8a5c2-receiver-source.md
          git diff --cached --quiet && exit 0
          git commit -m "Trace d8a5c2 receiver source"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

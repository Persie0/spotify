name: Backslice smart skip interval providers

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/backslice-smart-skip-interval-providers.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/intprov
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/intprov
      - name: Trace providers
        run: |
          SO=/tmp/intprov/liborbit-jni-spotify.so
          objdump -d -M intel --start-address=0x135d056 --stop-address=0x135fc20 "$SO" > /tmp/intprov/ctor.dis
          {
            echo '# Smart skip interval-provider backslice'
            echo
            echo 'Install sites: 0x135fc03 [dep+0xb08]=r15; 0x135fc0a [dep+0xb10]=r12.'
            echo
            echo '## Full final constructor window 0x135f800..0x135fc20'
            objdump -d -M intel --start-address=0x135f800 --stop-address=0x135fc20 "$SO"
            echo
            echo '## Definitions of r15/r12 in entire constructor before install'
            grep -E '^[[:space:]]*[0-9a-f]+:.*[[:space:]](mov|lea|pop|xchg)[[:space:]]+(r15|r12)([^a-zA-Z0-9]|$)' /tmp/intprov/ctor.dis || true
            echo
            echo '## Last definitions with context'
            python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('/tmp/intprov/ctor.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m:ins.append((int(m.group(1),16),i,m.group(2),l))
          for reg,target in [('r15',0x135fc03),('r12',0x135fc0a)]:
            defs=[]
            for a,i,op,l in ins:
              if a>=target:break
              if re.match(r'(mov|lea|pop|xchg)\s+'+reg+r'\b',op):
                defs.append((a,i,op,l))
            print(f'### {reg}: {len(defs)} definitions; last 10')
            for a,i,op,l in defs[-10:]:
              print(f'#### 0x{a:x}: {op}')
              for x in lines[max(0,i-18):min(len(lines),i+32)]:print('    '+x)
              print()
            if defs:
              a,i,op,l=defs[-1]
              print(f'### FINAL {reg} definition before install: 0x{a:x}: {op}')
              for x in lines[max(0,i-80):min(len(lines),i+120)]:print('    '+x)
              print()
          PY
          } > analysis/smart-skip-interval-provider-backslice.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/smart-skip-interval-provider-backslice.md
          git diff --cached --quiet && exit 0
          git commit -m "Backslice smart skip interval providers"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

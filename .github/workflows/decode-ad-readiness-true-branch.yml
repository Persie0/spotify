name: Decode ad readiness true branch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decode-ad-readiness-true-branch.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/adready
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/adready
      - name: Decode branch
        run: |
          SO=/tmp/adready/liborbit-jni-spotify.so
          {
            echo '# adObject+0x1b8 readiness true branch'
            echo
            echo 'Anchor: 0x1352547 reads [adObject+0x1b8] and 0x1352702 branches on it.'
            echo
            echo '## Exact branch 0x13526e0..0x1352920'
            objdump -d -M intel --start-address=0x13526e0 --stop-address=0x1352920 "$SO"
            echo
            echo '## Wider object build 0x13524c0..0x1352b20'
            objdump -d -M intel --start-address=0x13524c0 --stop-address=0x1352b20 "$SO"
            echo
            echo '## String references from branch'
            objdump -d -M intel --start-address=0x13526e0 --stop-address=0x1352920 "$SO" | grep -E '# 3[0-9a-f]{5,}' || true
            echo
            echo '## Direct callees in true branch'
            objdump -d -M intel --start-address=0x135270d --stop-address=0x135290a "$SO" | grep -E 'call[[:space:]]+' || true
          } > analysis/ad-readiness-true-branch.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ad-readiness-true-branch.md
          git diff --cached --quiet && exit 0
          git commit -m "Decode ad readiness true branch"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

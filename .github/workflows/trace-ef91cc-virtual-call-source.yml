name: Trace ef91cc virtual-call source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trace-ef91cc-virtual-call-source.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/efcall
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/efcall

      - name: Install helper
        run: python3 -m pip install --quiet pyelftools

      - name: Trace interface and call source
        run: |
          SO=/tmp/efcall/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/efcall/all.dis
          python3 - <<'PY' > analysis/ef91cc-virtual-call-source.md
          from pathlib import Path
          import re,bisect,struct
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/efcall/liborbit-jni-spotify.so')
          data=so.read_bytes()
          lines=Path('/tmp/efcall/all.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m: ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]

          with so.open('rb') as f:
            elf=ELFFile(f); loads=[]
            for s in elf.iter_segments():
              if s['p_type']=='PT_LOAD':
                loads.append((s['p_offset'],s['p_offset']+s['p_filesz'],s['p_vaddr']))
            dwarf=elf.get_dwarf_info(); fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location']; z=a+e['address_range']
                if z>a: fdes.append((a,z))
            rel={}
            for sec in elf.iter_sections():
              if sec['sh_type'] not in ('SHT_RELA','SHT_REL'): continue
              for rr in sec.iter_relocations():
                add=rr.entry.get('r_addend')
                if add is not None: rel[rr['r_offset']]=add
          fdes.sort(); starts=[a for a,z in fdes]

          def fde(a):
            if a is None:return None
            k=bisect.bisect_right(starts,a)-1
            if k>=0 and fdes[k][0]<=a<fdes[k][1]: return fdes[k]
          def vo(v):
            for po,pe,pv in loads:
              if pv<=v<pv+(pe-po): return po+(v-pv)
          def q(v):
            if v in rel:return rel[v]
            o=vo(v)
            if o is None or o+8>len(data):return None
            return struct.unpack_from('<Q',data,o)[0]
          def idx(a):return bisect.bisect_left(addrs,a)
          def ctx(a,b=20,n=36):
            j=idx(a)
            for x in ins[max(0,j-b):min(len(ins),j+n+1)]:print('    '+x[3])
          def body(fr,cap=2400):
            if not fr:return []
            j=idx(fr[0]);out=[]
            for x in ins[j:]:
              if x[0]>=fr[1] or len(out)>=cap:break
              out.append(x)
            return out

          target=0xef91cc
          print('# ef91cc interface / virtual-call source trace')
          print()
          print('Goal: identify the source object passed in rsi to ef91cc; ef91cc later copies source+0x10 into the Skip Ad adapter readiness receiver.')
          print()

          # Determine valid AP around relocation group.
          print('## Candidate address points around 0x18365e0')
          for ap in range(0x18365d0,0x1836631,8):
            print(f'### AP 0x{ap:x}')
            print(f'- header[-0x10]={q(ap-0x10)} header[-0x8]={q(ap-8)}')
            for off in range(0,0x48,8):
              v=q(ap+off)
              print(f'- +0x{off:x}: {("0x%x"%v) if v is not None else None} FDE={fde(v) if v else None}')
          print()

          # All relocation slots to ef91cc.
          slots=[off for off,add in rel.items() if add==target]
          print('## Relocation slots targeting ef91cc')
          for off in slots: print(f'- 0x{off:x}')
          print()

          # Infer APs from plausible slot indices 0x20..0x40 and validate header.
          aps=[]
          for off in slots:
            for slot in (0x20,0x28,0x30,0x38,0x40):
              ap=off-slot
              h0=q(ap-0x10);h1=q(ap-8)
              code=sum(1 for x in range(0,0x50,8) if q(ap+x) and fde(q(ap+x)))
              if code>=4:
                aps.append((ap,slot,h0,h1,code))
          print('## Inferred interface APs')
          for x in aps: print(f'- AP 0x{x[0]:x}, ef91cc slot +0x{x[1]:x}, header=({x[2]},{x[3]}), codeSlots={x[4]}')
          print()

          # Code materializations of inferred APs.
          aset={x[0] for x in aps}
          print('## Code materializations of inferred APs')
          for a,i,op,l in ins:
            m=re.search(r'#\s*([0-9a-f]+)\b',l)
            if m and int(m.group(1),16) in aset:
              print(f'### 0x{a:x}: {op}; FDE={fde(a)}')
              ctx(a,14,28);print()

          # Look for indirect calls using matching slot offsets globally, rank functions with source-like field accesses
          # and TimelineAds registry ID 0xb7/table+0x5b8 nearby.
          candidate_slots=sorted({x[1] for x in aps})
          print('## Indirect calls at inferred ef91cc slot offsets')
          hits=[]
          for a,i,op,l in ins:
            for slot in candidate_slots:
              if re.search(r'call\s+QWORD PTR \[[^]]+\+0x'+format(slot,'x')+r'\]',op):
                fr=fde(a)
                if fr: hits.append((a,i,op,fr,slot))
          print(f'- total hits: {len(hits)}')
          scored=[]
          for a,i,op,fr,slot in hits:
            rows=body(fr)
            txt='\n'.join(x[2] for x in rows)
            score=0
            if '0xb7' in txt: score+=8
            if '+0x5b8]' in txt: score+=8
            if '+0x1b8]' in txt: score+=5
            if '+0x1b5]' in txt: score+=4
            if '+0x10]' in txt: score+=2
            if 0x1300000<=fr[0]<0x1400000: score+=3
            if 0xef0000<=fr[0]<0xf10000: score+=3
            scored.append((score,a,i,op,fr,slot))
          scored.sort(reverse=True,key=lambda x:(x[0],-x[1]))
          for score,a,i,op,fr,slot in scored[:180]:
            print(f'### score={score} call 0x{a:x} slot +0x{slot:x}; FDE=0x{fr[0]:x}..0x{fr[1]:x}: {op}')
            ctx(a,28,45);print()

          # Find vptr writes of inferred APs and recover object constructor/materializer.
          print('## Vptr stores / owner constructors for inferred APs')
          for a,i,op,l in ins:
            m=re.search(r'#\s*([0-9a-f]+)\b',l)
            if not m or int(m.group(1),16) not in aset:continue
            # print forward until likely store of loaded reg
            print(f'### AP ref 0x{a:x}: {op}; FDE={fde(a)}')
            ctx(a,10,35);print()

          # ef91cc itself: source uses that matter to Skip Ad.
          print('## ef91cc source-field use summary')
          fr=fde(target)
          if fr:
            for a,i,op,l in body(fr):
              if any(x in op for x in ('+0x10]','+0x1b5]','+0x1b8]','+0x1b2]','+0x1d4]','+0x258]','+0x250]')):
                print('    '+l)
          print()

          # Specific TimelineAds lookup callsite in TimelineConductor factory, for comparison.
          print('## TimelineAds ID 0xb7 lookup context')
          ctx(0x135c936,20,55)
          print()
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ef91cc-virtual-call-source.md
          git diff --cached --quiet && exit 0
          git commit -m "Trace ef91cc virtual call source"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

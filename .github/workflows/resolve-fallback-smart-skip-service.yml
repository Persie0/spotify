name: Resolve fallback smart skip service ID

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/resolve-fallback-smart-skip-service.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/fbsvc
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/fbsvc
      - name: Decode accessor
        run: |
          SO=/tmp/fbsvc/liborbit-jni-spotify.so
          {
            echo '# Fallback smart-skip registry accessor'
            echo
            echo '## b9150c'
            objdump -d -M intel --start-address=0xb914b0 --stop-address=0xb91590 "$SO"
            echo
            echo '## primary b632ca reference'
            objdump -d -M intel --start-address=0xb632c0 --stop-address=0xb632f5 "$SO"
          } > analysis/smart-skip-fallback-service-id.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/smart-skip-fallback-service-id.md
          git diff --cached --quiet && exit 0
          git commit -m "Resolve fallback smart skip service ID"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

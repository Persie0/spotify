name: Fast field428 variant window
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fast-field428-variant-window.yml"
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/f428win
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/f428win
      - name: Dump exact window
        run: |
          SO=/tmp/f428win/liborbit-jni-spotify.so
          {
            echo '# Fast field428 variant-selection window'
            echo
            echo '## 0xe9fb00..0xea0400'
            objdump -d -M intel --start-address=0xe9fb00 --stop-address=0xea0400 "$SO"
            echo
            echo '## Branches/tests only'
            objdump -d -M intel --start-address=0xe9fb00 --stop-address=0xea0400 "$SO" | grep -E '[[:space:]](j[a-z]+|cmp|test|cmov[a-z]+|set[a-z]+)[[:space:]]' || true
            echo
            echo '## High-address refs'
            objdump -d -M intel --start-address=0xe9fb00 --stop-address=0xea0400 "$SO" | grep -E '# 18[0-9a-f]+' || true
            echo
            echo '## Key stack blocks'
            objdump -d -M intel --start-address=0xe9e000 --stop-address=0xea0400 "$SO" | grep -E 'rsp\+0x(770|778|780|788|790|798|1060|1068|1070|1078|1080|1088)' || true
          } > analysis/field428-variant-window-fast.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/field428-variant-window-fast.md
          git diff --cached --quiet && exit 0
          git commit -m "Dump field428 variant window"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

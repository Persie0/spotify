name: Resolve TimelineConductor b0 b8 providers

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/resolve-timeline-b0-b8-providers.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/tlb0b8
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/tlb0b8
      - name: Trace fields
        run: |
          SO=/tmp/tlb0b8/liborbit-jni-spotify.so
          objdump -d -M intel --start-address=0x135d056 --stop-address=0x1360c1b "$SO" > /tmp/tlb0b8/ctor.dis
          objdump -d -M intel "$SO" > /tmp/tlb0b8/all.dis
          python3 - <<'PY' > analysis/timeline-conductor-b0-b8-providers.md
          from pathlib import Path
          import re
          ctor=Path('/tmp/tlb0b8/ctor.dis').read_text(errors='replace').splitlines()
          all_lines=Path('/tmp/tlb0b8/all.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(ctor):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m: ins.append((int(m.group(1),16),i,m.group(2),l))

          def ctx(i,b=16,a=28):
            for x in ctor[max(0,i-b):min(len(ctor),i+a+1)]: print('    '+x)

          print('# TimelineConductor +0xb0 / +0xb8 smart-skip provider trace')
          print()
          print('Known aliases from constructor entry:')
          print('- 0x135d155 lea rax,[this+0xb0]; 0x135d15c -> [rsp+0xa8]')
          print('- 0x135d164 lea rax,[this+0xb8]; 0x135d16b -> [rsp+0xa0]')
          print('- later primary provider base = *([rsp+0xa8]); dependency+0xb08 = base+0x10')
          print('- later fallback provider base = *([rsp+0xa0]); dependency+0xb10 = base+0x10')
          print()

          for slot,field in [('a8','b0'),('a0','b8')]:
            print(f'## Alias slot rsp+0x{slot} / TimelineConductor+0x{field}')
            refs=[]
            for a,i,op,l in ins:
              if f'[rsp+0x{slot}]' in op:
                refs.append((a,i,op,l))
                print(f'### 0x{a:x}: {op}')
                ctx(i,12,22); print()
            writes=[]
            for a,i,op,l in refs:
              left=op.split(',',1)[0]
              if f'[rsp+0x{slot}]' in left and re.match(r'(mov|lea|xchg)',op):
                writes.append((a,i,op,l))
            print('### alias-slot writes only')
            for a,i,op,l in writes: print('    '+l)
            print()

          print('## Direct writes to this+0xb0 and this+0xb8 in constructor')
          for a,i,op,l in ins:
            left=op.split(',',1)[0]
            if re.search(r'\[[a-z0-9]+\+0xb[08]\]',left) and re.match(r'(mov|xchg|and|or|xor)',op):
              print(f'### 0x{a:x}: {op}')
              ctx(i,14,26); print()

          print('## Writes through aliases loaded from rsp+a8/a0')
          for slot,field in [('a8','b0'),('a0','b8')]:
            for idx,(a,i,op,l) in enumerate(ins):
              m=re.match(r'mov\s+(r\w+),QWORD PTR \[rsp\+0x'+slot+r'\]',op)
              if not m:continue
              reg=m.group(1)
              print(f'### {field} alias {reg} loaded @0x{a:x}')
              for aa,ii,oo,ll in ins[idx:min(len(ins),idx+90)]:
                if aa!=a and re.match(r'(mov|lea|pop|xchg|xor)\s+'+re.escape(reg)+r'(?:d)?\b',oo):
                  print('    CLOBBER '+ll);break
                if reg in oo:
                  print('    '+ll)
              print()

          # Find exact stores through the known alias register, and identify RHS producer.
          print('## Candidate pointer assignments to b0/b8 fields')
          for slot,field in [('a8','b0'),('a0','b8')]:
            for idx,(a,i,op,l) in enumerate(ins):
              m=re.match(r'mov\s+(r\w+),QWORD PTR \[rsp\+0x'+slot+r'\]',op)
              if not m:continue
              reg=m.group(1)
              for aa,ii,oo,ll in ins[idx+1:min(len(ins),idx+100)]:
                if re.match(r'(mov|lea|pop|xchg|xor)\s+'+re.escape(reg)+r'(?:d)?\b',oo):break
                left=oo.split(',',1)[0]
                if '['+reg+']' in left and re.match(r'mov\s+QWORD PTR',oo):
                  print(f'### field {field}; store 0x{aa:x}: {oo}')
                  ctx(ii,40,40);print()

          # Search whole constructor for likely pointer-to-field pattern: load alias slot to reg then mov [reg],src.
          print('## High-address/vptr constants near provider-field assignments')
          for a,i,op,l in ins:
            if not any(x in op for x in ('[rsp+0xa8]','[rsp+0xa0]')): continue
            for x in ctor[max(0,i-40):min(len(ctor),i+60)]:
              if re.search(r'#\s*18[0-9a-f]{5,}',x): print('    '+x)
            print()

          # Whole-binary consumers of direct TimelineConductor vtable getter methods for b0/b8 if any compact getter exists.
          print('## Compact getters reading +0xb0/+0xb8 across binary')
          for i,l in enumerate(all_lines):
            if re.search(r'mov\s+rax,QWORD PTR \[rdi\+0xb0\]',l) or re.search(r'mov\s+rax,QWORD PTR \[rdi\+0xb8\]',l):
              print('### hit')
              for x in all_lines[max(0,i-4):min(len(all_lines),i+8)]:print('    '+x)
              print()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/timeline-conductor-b0-b8-providers.md
          git diff --cached --quiet && exit 0
          git commit -m "Resolve TimelineConductor b0 b8 providers"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

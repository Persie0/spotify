name: Dump readiness receiver r14 source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dump-readiness-r14-source.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/r14
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/r14
      - name: Dump source
        run: |
          {
            echo '# Readiness receiver r14 source'
            echo
            echo 'Target: 0xefb7a5 moves r14 into r15; r15 is later stored at adapter outer+0x58.'
            echo
            objdump -d -M intel --start-address=0xefb580 --stop-address=0xefb7c0 /tmp/r14/liborbit-jni-spotify.so
          } > analysis/skip-ad-readiness-r14-source.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/skip-ad-readiness-r14-source.md
          git diff --cached --quiet && exit 0
          git commit -m "Dump readiness receiver r14 source"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

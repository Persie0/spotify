name: Backslice final readiness carrier inner pointer

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/backslice-final-readiness-carrier-inner.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/carinner
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/carinner
      - name: Trace r12
        run: |
          SO=/tmp/carinner/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/carinner/all.dis
          {
            echo '# Final readiness carrier inner pointer'
            echo
            echo 'Anchor: e94925 writes carrier base+0x20 = r12. AP 0x1843bf8 +0x10 (fec736) delegates to [interface+8] = carrier base+0x20, then calls that inner object virtual +0x10.'
            echo
            echo '## Construction window e94600..e94930'
            objdump -d -M intel --start-address=0xe94600 --stop-address=0xe94930 "$SO"
            echo
            echo '## All r12 definitions in window'
            objdump -d -M intel --start-address=0xe94600 --stop-address=0xe94930 "$SO" | grep -E '(^|[[:space:]])(mov|lea|xchg|pop)[[:space:]]+r12([,[:space:]]|$)' || true
            echo
            echo '## Wider previous r12 definitions e94000..e94930'
            objdump -d -M intel --start-address=0xe94000 --stop-address=0xe94930 "$SO" | grep -E -B14 -A28 '(^|[[:space:]])(mov|lea|xchg|pop)[[:space:]]+r12([,[:space:]]|$)' || true
            echo
            echo '## AP materializations near last r12 definition'
            objdump -d -M intel --start-address=0xe94600 --stop-address=0xe94930 "$SO" | grep -E -B18 -A30 '# 18[0-9a-f]{5,}' || true
          } > analysis/final-readiness-carrier-inner.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/final-readiness-carrier-inner.md
          git diff --cached --quiet && exit 0
          git commit -m "Backslice final readiness carrier inner pointer"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

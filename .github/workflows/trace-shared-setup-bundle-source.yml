name: Trace shared setup bundle source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trace-shared-setup-bundle-source.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/bundle-source
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir /tmp/bundle-source
          unzip -j /tmp/bundle-source/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/bundle-source
      - name: Trace bundle source
        run: |
          SO=/tmp/bundle-source/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/bundle-source/all.dis
          python3 - <<'PY' > analysis/shared-setup-bundle-source.md
          from pathlib import Path
          import re, bisect
          lines=Path('/tmp/bundle-source/all.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$', l)
            if m: ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]
          def idx(a): return bisect.bisect_left(addrs,a)
          def ctx(a,b=28,n=22):
            j=idx(a); return '\n'.join('    '+x[3] for x in ins[max(0,j-b):min(len(ins),j+n+1)])
          start,end=0x14cdc2a,0x14d4d4c
          region=[x for x in ins if start <= x[0] < end]
          print('# Shared setup bundle source trace')
          print()
          print('Rank-1 provider-vector caller FDE: `0x14cdc2a..0x14d4d4c`.')
          print('The previous report shows provider factories are called with hidden output in `rdi`, descriptor in `rsi`, shared setup bundle in `rdx`, and registry context in `rcx`.')
          print()
          print('## Provider +0x28 calls and rdx source')
          for a,i,op,l in region:
            if re.search(r'call\s+QWORD PTR \[rax\+0x28\]',op):
              print(f'### 0x{a:x}: {op}')
              print(ctx(a,34,10)); print()
          print('## r14/r13/r12/r15/rbx/rbp assignment points')
          for reg in ['r14','r13','r12','r15','rbx','rbp']:
            print(f'### {reg}')
            for a,i,op,l in region:
              if re.search(rf'\b(mov|lea|pop|xchg)\s+{reg}\b',op): print('    '+l)
            print()
          print('## Direct r14 references inside ranked FDE')
          for a,i,op,l in region:
            if 'r14' in op: print('    '+l)
          print('\n## Stores into r14-relative fields')
          found=False
          for a,i,op,l in region:
            dst=op.split(',',1)[0]
            if '[r14' in dst and not op.startswith(('cmp','test')):
              found=True; print(f'### 0x{a:x}: {op}'); print(ctx(a,18,14)); print()
          if not found:
            print('No direct `[r14+...]` stores were found in the ranked caller; the bundle is likely passed in already built.')
          print('\n## All +0x30 references in ranked FDE')
          for a,i,op,l in region:
            if '+0x30]' in op:
              print(f'### 0x{a:x}: {op}'); print(ctx(a,18,18)); print()
          print('\n## Callers of ranked FDE start')
          for a,i,op,l in ins:
            if re.search(r'\b(call|jmp)\s+14cdc2a\b',op) or '# 14cdc2a' in op:
              print(f'### 0x{a:x}: {op}'); print(ctx(a,45,32)); print()
          print('\n## Local helper calls around provider-vector region')
          for a,i,op,l in region:
            if 'call' in op and any(s in op for s in ['17da794','17d9bf2','17da7e8','14edb10','17edf00','memcpy@plt']):
              print(f'### 0x{a:x}: {op}'); print(ctx(a,14,10)); print()
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/shared-setup-bundle-source.md
          git diff --cached --quiet && exit 0
          git commit -m "Trace shared setup bundle source"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

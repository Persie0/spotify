name: Dump service184 core factory

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/dump-service184-core-factory.yml"

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true
      - name: Download and dump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/s184raw
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/s184raw
          {
            echo '# Raw service184 core factory 0x17db9e4..0x17dbc9a'
            echo
            objdump -d -M intel --start-address=0x17db9e4 --stop-address=0x17dbc9a /tmp/s184raw/liborbit-jni-spotify.so
          } > analysis/service184-core-factory-raw.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/service184-core-factory-raw.md
          git diff --cached --quiet && exit 0
          git commit -m "Dump service184 core factory"
          git pull --rebase origin main
          git push origin HEAD:main

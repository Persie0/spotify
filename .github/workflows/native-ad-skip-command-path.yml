name: Trace ad_skip timer dispatch and command

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/native-ad-skip-command-path.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/native
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/native

      - name: Install helper
        run: python3 -m pip install --quiet pyelftools

      - name: Trace ad_skip producer and dispatch
        run: |
          SO=/tmp/native/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/orbit.disasm
          python3 - <<'PY' > analysis/native-ad-skip-command-path.md
          from pathlib import Path
          import re
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/native/liborbit-jni-spotify.so')
          data=so.read_bytes()
          lines=Path('/tmp/orbit.disasm').read_text(errors='replace').splitlines()
          with so.open('rb') as f:
            elf=ELFFile(f)
            loads=[]
            for seg in elf.iter_segments():
              if seg['p_type']=='PT_LOAD':
                loads.append((seg['p_offset'],seg['p_offset']+seg['p_filesz'],seg['p_vaddr']))
            dwarf=elf.get_dwarf_info()
            fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location']; b=a+e['address_range']
                if b>a:fdes.append((a,b))
          fdes.sort()

          def va2off(va):
            for a,b,v in loads:
              if v<=va<v+(b-a): return a+(va-v)
          def cstring(va,maxlen=300):
            o=va2off(va)
            if o is None:return None
            e=data.find(b'\0',o,min(len(data),o+maxlen))
            if e<=o:return None
            raw=data[o:e]
            if not raw:return None
            if sum(32<=x<127 or x in (9,10,13) for x in raw)/len(raw)<.95:return None
            return raw.decode('utf-8','replace')
          def fde_for(addr):
            lo,hi=0,len(fdes)
            while lo<hi:
              m=(lo+hi)//2
              if fdes[m][0]<=addr:lo=m+1
              else:hi=m
            for k in range(max(0,lo-5),min(len(fdes),lo+2)):
              a,b=fdes[k]
              if a<=addr<b:return a,b
          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m:ins.append((int(m.group(1),16),i,m.group(2),l))
          def strings(fr):
            out=[]
            for a,i,op,l in ins:
              if not fr or not(fr[0]<=a<fr[1]) or '#' not in l:continue
              m=re.match(r'\s*([0-9a-f]+)\b',l.split('#',1)[1])
              if not m:continue
              s=cstring(int(m.group(1),16))
              if s and s not in out:out.append(s)
            return out
          def ctx(i,b=50,a=90):
            for x in lines[max(0,i-b):min(len(lines),i+a+1)]:print('    '+x)

          print('# ad_skip timer dispatch / command trace')
          print()
          print('Known producers: 0x139ba71 and 0x139be38 create event subtype 6 after calling ad-object vtable +0xe8 and multiplying the positive delay by 1000.')
          print()

          for site in (0x139ba71,0x139be38):
            hit=next((x for x in ins if x[0]==site),None)
            if hit:
              fr=fde_for(site)
              print(f'## Producer 0x{site:x}; FDE={fr}')
              print('Strings: '+' | '.join(strings(fr)))
              ctx(hit[1],80,160)
              print()

          # scheduler/construction helper directly called after subtype-6 object is built
          for target in (0x139c09a,):
            print(f'## Direct callers of 0x{target:x}')
            for a,i,op,l in ins:
              m=re.search(r'\b(?:call|jmp)\s+([0-9a-f]+)\b',op)
              if m and int(m.group(1),16)==target:
                fr=fde_for(a)
                print(f'### 0x{a:x}; caller={fr}')
                if fr:print('Strings: '+' | '.join(strings(fr)))
                ctx(i,35,55)
                print()

          # owner callback that consumes subtype 6
          for site in (0x10a9668,):
            hit=next((x for x in ins if x[0]==site),None)
            if hit:
              fr=fde_for(site)
              print(f'## Consumer 0x{site:x}; FDE={fr}')
              ctx(hit[1],10,60)
              print()

          # Find all references to literal ad_skip string address used by producers.
          # Resolve from known producer line references, then list all code xrefs.
          ad_addrs=set()
          for site in (0x139ba71,0x139be38):
            fr=fde_for(site)
            for a,i,op,l in ins:
              if fr and fr[0]<=a<fr[1] and '#' in l:
                m=re.match(r'\s*([0-9a-f]+)\b',l.split('#',1)[1])
                if m:
                  va=int(m.group(1),16)
                  if cstring(va)=='ad_skip':ad_addrs.add(va)
          print('## All ad_skip string xrefs')
          print('Addresses: '+', '.join(hex(x) for x in sorted(ad_addrs)))
          for a,i,op,l in ins:
            if any(f'# {va:x} ' in l or f'# {va:x}<' in l for va in ad_addrs):
              fr=fde_for(a)
              print(f'### 0x{a:x}; FDE={fr}')
              ctx(i,25,45)
              print()

          # Search for methods that call vtable +d0 and then dispatch actions,
          # not just restriction builder.
          print('## Indirect vtable +0xd0 calls with local context')
          for a,i,op,l in ins:
            if re.search(r'\bcall\s+QWORD PTR \[[a-z][a-z0-9]*\+0xd0\]',op):
              fr=fde_for(a)
              print(f'### 0x{a:x}; FDE={fr}')
              if fr:
                ss=strings(fr)
                if ss:print('Strings: '+' | '.join(ss[:80]))
              ctx(i,25,45)
              print()
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/native-ad-skip-command-path.md
          git diff --cached --quiet && exit 0
          git commit -m "Trace ad_skip timer dispatch and command path"
          git pull --rebase origin main
          git push origin HEAD:main

name: Resolve readiness secondary interface

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/resolve-readiness-secondary-interface.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/readif
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/readif
      - name: Install helper
        run: python3 -m pip install --quiet pyelftools
      - name: Resolve candidate interfaces
        run: |
          SO=/tmp/readif/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/readif/all.dis
          python3 - <<'PY' > analysis/readiness-secondary-interface.md
          from pathlib import Path
          import re,bisect,struct
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/readif/liborbit-jni-spotify.so')
          data=so.read_bytes()
          lines=Path('/tmp/readif/all.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m:ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]

          with so.open('rb') as f:
            elf=ELFFile(f);loads=[]
            for s in elf.iter_segments():
              if s['p_type']=='PT_LOAD':loads.append((s['p_offset'],s['p_offset']+s['p_filesz'],s['p_vaddr']))
            dwarf=elf.get_dwarf_info();fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location'];z=a+e['address_range']
                if z>a:fdes.append((a,z))
            rel={}
            for sec in elf.iter_sections():
              if sec['sh_type'] not in ('SHT_RELA','SHT_REL'):continue
              for rr in sec.iter_relocations():
                add=rr.entry.get('r_addend')
                if add is not None:rel[rr['r_offset']]=add
          fdes.sort();starts=[a for a,z in fdes]

          def fde(a):
            k=bisect.bisect_right(starts,a)-1
            if k>=0 and fdes[k][0]<=a<fdes[k][1]:return fdes[k]
          def vo(v):
            for po,pe,pv in loads:
              if pv<=v<pv+(pe-po):return po+(v-pv)
          def q(v):
            if v in rel:return rel[v]
            o=vo(v)
            if o is None or o+8>len(data):return None
            return struct.unpack_from('<Q',data,o)[0]
          def ctx(a,b=6,n=24):
            j=bisect.bisect_left(addrs,a)
            for x in ins[max(0,j-b):min(len(ins),j+n+1)]:print('    '+x[3])

          candidates=[0x183ba50,0x183bc38,0x183bc88,0x183be70,0x183be98,0x1836728,0x1841fc0]
          print('# Readiness secondary-interface ABI validation')
          print()
          print('Hard ABI requirement from fd384d:')
          print('- receiver is in rdi only')
          print('- call [vptr+0x140]')
          print('- immediately test eax')
          print('- therefore candidate +0x140 target must be valid as a this-only scalar-return method')
          print()
          for ap in candidates:
            print(f'## AP candidate 0x{ap:x}')
            print(f'- header[-0x10]=0x{(q(ap-0x10) or 0):x} header[-0x8]=0x{(q(ap-8) or 0):x}')
            vals={off:q(ap+off) for off in range(0,0x160,8)}
            for off in (0,8,0x10,0x20,0x70,0x98,0x128,0x130,0x138,0x140,0x148):
              v=vals.get(off)
              print(f'- +0x{off:x}: {("0x%x"%v) if v is not None else None} FDE={fde(v) if v else None}')
            t=vals.get(0x140)
            if t and fde(t):
              fr=fde(t)
              print(f'### +0x140 target 0x{t:x} body (FDE 0x{fr[0]:x}..0x{fr[1]:x})')
              count=0
              for a,i,op,l in ins:
                if fr[0]<=a<fr[1]:
                  print('    '+l);count+=1
                  if count>220:
                    print('    ...truncated...');break
            print()

          print('## Construction window f419b4')
          for a,i,op,l in ins:
            if 0xf419b4<=a<0xf41a60:print('    '+l)
          print()

          print('## Direct materializations of candidate APs')
          cand=set(candidates)
          for a,i,op,l in ins:
            m=re.search(r'#\s*([0-9a-f]+)\b',l)
            if m and int(m.group(1),16) in cand:
              print(f'### 0x{a:x}: {op}')
              ctx(a,8,14);print()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/readiness-secondary-interface.md
          git diff --cached --quiet && exit 0
          git commit -m "Resolve readiness secondary interface"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 1; done
          exit 1

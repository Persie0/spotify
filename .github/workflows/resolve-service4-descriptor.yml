name: Resolve registry service 4 descriptor

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/resolve-service4-descriptor.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/svc4
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/svc4
      - name: Install helper
        run: python3 -m pip install --quiet pyelftools
      - name: Resolve descriptor
        run: |
          SO=/tmp/svc4/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/svc4/all.dis
          python3 - <<'PY' > analysis/service4-descriptor.md
          from pathlib import Path
          import re,bisect,struct
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/svc4/liborbit-jni-spotify.so')
          data=so.read_bytes()
          lines=Path('/tmp/svc4/all.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m:ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]

          with so.open('rb') as f:
            elf=ELFFile(f)
            loads=[]
            for s in elf.iter_segments():
              if s['p_type']=='PT_LOAD':loads.append((s['p_offset'],s['p_offset']+s['p_filesz'],s['p_vaddr']))
            dwarf=elf.get_dwarf_info(); fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location'];z=a+e['address_range']
                if z>a:fdes.append((a,z))
            rel={}
            for sec in elf.iter_sections():
              if sec['sh_type'] not in ('SHT_RELA','SHT_REL'):continue
              for rr in sec.iter_relocations():
                add=rr.entry.get('r_addend')
                if add is not None:rel[rr['r_offset']]=add
          fdes.sort(); starts=[a for a,z in fdes]

          def fde(a):
            k=bisect.bisect_right(starts,a)-1
            if k>=0 and fdes[k][0]<=a<fdes[k][1]:return fdes[k]
          def vo(v):
            for po,pe,pv in loads:
              if pv<=v<pv+(pe-po):return po+(v-pv)
          def q(v):
            if v in rel:return rel[v]
            o=vo(v)
            if o is None or o+8>len(data):return None
            return struct.unpack_from('<Q',data,o)[0]
          def cstr(v,cap=400):
            o=vo(v)
            if o is None:return None
            e=data.find(b'\0',o,min(len(data),o+cap))
            if e<0:return None
            try:return data[o:e].decode('utf8')
            except:return None
          def ctx(a,b=8,n=16):
            j=bisect.bisect_left(addrs,a)
            for x in ins[max(0,j-b):min(len(ins),j+n+1)]:print('    '+x[3])

          print('# Registry service ID 4 descriptor')
          print()
          print('Authoritative accessor:')
          print('- b85f7e validates ID 4')
          print('- then returns table[4] at facade[0] + 0x20')
          print()

          # Find tiny methods returning 4.
          methods=[]
          for a,i,op,l in ins:
            if re.fullmatch(r'mov\s+(?:al|eax),0x4',op) or op in ('mov    al,0x4','mov    eax,0x4'):
              fr=fde(a)
              if fr and fr[1]-fr[0]<=0x40 and fr not in methods:methods.append(fr)
          print(f'## Tiny ID=4 methods: {len(methods)}')
          for fr in methods:
            print(f'### FDE 0x{fr[0]:x}..0x{fr[1]:x}')
            for a,i,op,l in ins:
              if fr[0]<=a<fr[1]:print('    '+l)
            slots=[off for off,add in rel.items() if add==fr[0]]
            for off in slots:
              print(f'- relocation slot 0x{off:x} -> ID method')
              # Descriptor ABI seen elsewhere has ID at +0x10.
              for delta in (0x10,0x18,0x20,0x28):
                ap=off-delta
                vals={x:q(ap+x) for x in range(0,0x40,8)}
                code=sum(1 for v in vals.values() if v and fde(v))
                if code<3:continue
                print(f'  candidate AP 0x{ap:x} assuming ID slot +0x{delta:x}:')
                for x,v in vals.items():print(f'    +0x{x:x}: {("0x%x"%v) if v is not None else None} FDE={fde(v) if v else None}')
                meta=vals.get(0x18)
                if meta and fde(meta):
                  ss=[]
                  for aa,ii,oo,ll in ins:
                    if fde(aa)!=fde(meta):continue
                    m=re.search(r'#\s*([0-9a-f]+)\b',ll)
                    if m:
                      s=cstr(int(m.group(1),16))
                      if s and 3<=len(s)<=160 and s not in ss:ss.append(s)
                  if ss: print('    metadata strings: '+repr(ss))
                fac=vals.get(0x28)
                if fac: print(f'    factory +0x28: 0x{fac:x} FDE={fde(fac)}')
            print()

          print('## b85f7e')
          ctx(0xb85f7e,2,22)
          print()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/service4-descriptor.md
          git diff --cached --quiet && exit 0
          git commit -m "Resolve registry service 4 descriptor"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 1; done
          exit 1

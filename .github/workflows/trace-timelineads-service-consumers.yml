name: Trace TimelineAds service consumers

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trace-timelineads-service-consumers.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/tadsc
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/tadsc
      - name: Install helper
        run: python3 -m pip install --quiet pyelftools
      - name: Trace local dataflow
        run: |
          SO=/tmp/tadsc/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/tadsc/all.dis
          python3 - <<'PY' > analysis/timelineads-service-consumers.md
          from pathlib import Path
          import re,bisect
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          lines=Path('/tmp/tadsc/all.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m:ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]
          with open('/tmp/tadsc/liborbit-jni-spotify.so','rb') as f:
            elf=ELFFile(f);dwarf=elf.get_dwarf_info();fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location'];z=a+e['address_range']
                if z>a:fdes.append((a,z))
          fdes.sort();starts=[a for a,z in fdes]
          def fde(a):
            k=bisect.bisect_right(starts,a)-1
            if k>=0 and fdes[k][0]<=a<fdes[k][1]:return fdes[k]
          def idx(a):return bisect.bisect_left(addrs,a)
          def ctx(a,b=18,n=35):
            j=idx(a)
            for x in ins[max(0,j-b):min(len(ins),j+n+1)]:print('    '+x[3])
          def body(fr):
            j=idx(fr[0]);out=[]
            for x in ins[j:]:
              if x[0]>=fr[1]:break
              out.append(x)
            return out

          anchor=0x135c943
          fr=fde(anchor)
          print('# TimelineAds service ID 0xb7 consumer trace')
          print()
          print('Anchor:')
          print('- registry ID 0xb7 = TimelineAdsSetupImpl')
          print('- 0x135c943 loads table[0xb7] / +0x5b8')
          print('- 0x135c94a stores it into factory local [rsp+0x120]')
          print()
          print(f'## Containing TimelineConductor factory FDE={fr}')
          rows=body(fr) if fr else []
          print()

          print('## All [rsp+0x120] accesses')
          for k,(a,i,op,l) in enumerate(rows):
            if '[rsp+0x120]' in op:
              side='WRITE' if '[rsp+0x120]' in op.split(',',1)[0] else 'READ'
              print(f'### {side} 0x{a:x}: {op}')
              for x in rows[max(0,k-16):min(len(rows),k+32)]:print('    '+x[3])
              print()

          print('## Register-forwarding from each read of [rsp+0x120]')
          for k,(a,i,op,l) in enumerate(rows):
            if '[rsp+0x120]' not in op or '[rsp+0x120]' in op.split(',',1)[0]:continue
            m=re.match(r'mov\s+(r\w+),QWORD PTR \[rsp\+0x120\]',op)
            reg=m.group(1) if m else None
            print(f'### read 0x{a:x}: {op}; reg={reg}')
            for x in rows[k:min(len(rows),k+100)]:
              aa,ii,oo,ll=x
              if reg and re.search(r'\b'+re.escape(reg)+r'\b',oo):
                print('    '+ll)
              elif aa<a+0x180 and re.search(r'\b(call|push|mov|lea|test|cmp)\b',oo):
                print('    '+ll)
            print()

          print('## Calls after TimelineAds lookup that receive local/derived value')
          # Emit all calls for 0x900 bytes after lookup; argument context is small enough to inspect.
          for a,i,op,l in rows:
            if 0x135c943<=a<0x135d300 and re.search(r'\bcall\b',op):
              print(f'### 0x{a:x}: {op}')
              ctx(a,12,18);print()

          print('## Writes to newly allocated TimelineConductor/service objects using TimelineAds-derived regs')
          # Track simple direct reads into a register and report memory stores of that reg in next 80 insns.
          for k,(a,i,op,l) in enumerate(rows):
            m=re.match(r'mov\s+(r\w+),QWORD PTR \[rsp\+0x120\]',op)
            if not m:continue
            reg=m.group(1)
            print(f'### source reg {reg} @0x{a:x}')
            for aa,ii,oo,ll in rows[k:min(len(rows),k+80)]:
              if re.search(r'\b'+re.escape(reg)+r'\b',oo) and '[' in oo.split(',',1)[0]:
                print('    '+ll)
            print()

          print('## Registry 0xb7 access context')
          ctx(anchor,22,42)
          print()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add analysis/timelineads-service-consumers.md
          git diff --cached --quiet && exit 0
          git commit -m "Trace TimelineAds service consumers"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 1; done
          exit 1

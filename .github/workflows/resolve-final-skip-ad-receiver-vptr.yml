name: Resolve final Skip Ad receiver vptr

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/resolve-final-skip-ad-receiver-vptr.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/finalrecv
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/finalrecv

      - name: Install helper
        run: python3 -m pip install --quiet pyelftools

      - name: Resolve receiver
        run: |
          SO=/tmp/finalrecv/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/finalrecv/all.dis
          python3 - <<'PY' > analysis/final-skip-ad-receiver-vptr.md
          from pathlib import Path
          import re,bisect,struct
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/finalrecv/liborbit-jni-spotify.so')
          data=so.read_bytes()
          lines=Path('/tmp/finalrecv/all.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(lines):
              m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
              if m: ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]

          with so.open('rb') as f:
              elf=ELFFile(f); dwarf=elf.get_dwarf_info(); fdes=[]; loads=[]; rel={}
              for seg in elf.iter_segments():
                  if seg['p_type']=='PT_LOAD':
                      loads.append((seg['p_offset'],seg['p_offset']+seg['p_filesz'],seg['p_vaddr']))
              for e in dwarf.EH_CFI_entries():
                  if isinstance(e,FDE):
                      a=e['initial_location']; z=a+e['address_range']
                      if z>a:fdes.append((a,z))
              for sec in elf.iter_sections():
                  if sec['sh_type'] not in ('SHT_RELA','SHT_REL'): continue
                  for rr in sec.iter_relocations():
                      add=rr.entry.get('r_addend')
                      if add is not None: rel[rr['r_offset']]=add
          fdes.sort(); starts=[a for a,z in fdes]
          def fde(a):
              k=bisect.bisect_right(starts,a)-1
              if k>=0 and fdes[k][0]<=a<fdes[k][1]: return fdes[k]
          def idx(a): return bisect.bisect_left(addrs,a)
          def body(fr):
              j=idx(fr[0]); out=[]
              for x in ins[j:]:
                  if x[0]>=fr[1]: break
                  out.append(x)
              return out
          def ctx(a,b=12,n=25):
              j=idx(a)
              return '\n'.join('    '+x[3] for x in ins[max(0,j-b):min(len(ins),j+n+1)])
          def vo(v):
              for po,pe,pv in loads:
                  if pv<=v<pv+(pe-po): return po+(v-pv)
          def q(v):
              if v in rel:return rel[v]
              o=vo(v)
              if o is None or o+8>len(data):return None
              return struct.unpack_from('<Q',data,o)[0]

          print('# Final Skip Ad readiness receiver vptr')
          print()
          print('Proven chain:')
          print('- 0x122190f -> rsp+0x1338 points at a 0x6b0-stride element')
          print('- e9c8ec -> rsp+0x770')
          print('- e9ccf3 -> state+0x10')
          print('- efc630 -> adapter receiver')
          print('- fd384d -> receiver vtable +0x140, EAX must be zero')
          print()

          for target,name in [(0x12240f8,'base copy'),(0x12240cc,'full copy'),(0x108dcd4,'tail copy +0x160'),(0x122385e,'source builder from 0x550 element')]:
              fr=fde(target)
              print(f'## {name} 0x{target:x} FDE={fr}')
              if fr:
                  for x in body(fr): print('    '+x[3])
              print()

          print('## Source builder high-address constants / direct vptr stores')
          for target in (0x122385e,0x12240f8):
              fr=fde(target)
              if not fr: continue
              for a,i,op,l in body(fr):
                  if '# 18' in l or '# 19' in l or (re.match(r'(mov|lea)',op) and '[' in op.split(',',1)[0]):
                      if '# 18' in l or '# 19' in l:
                          print(f'### 0x{a:x}: {op}')
                          print(ctx(a,8,12))
                          print()

          print('## Writes to destination head in source builder')
          fr=fde(0x122385e)
          if fr:
              rows=body(fr)
              for k,(a,i,op,l) in enumerate(rows):
                  left=op.split(',',1)[0]
                  if not re.match(r'(mov|movups|movdqu|movaps|movdqa|lea)',op): continue
                  if re.search(r'\[(?:rdi|rbx|r12|r13|r14|r15)(?:\+0x(?:0|8|10|18|20|28|30|38|40))?\]',left):
                      print(f'- 0x{a:x}: {op}')
                      for x in rows[max(0,k-5):min(len(rows),k+10)]: print('    '+x[3])
                      print()

          print('## All direct calls to source builder 0x122385e')
          for a,i,op,l in ins:
              if re.search(r'\bcall\s+122385e\b',op):
                  print(f'### caller 0x{a:x} FDE={fde(a)}')
                  print(ctx(a,20,35))
                  print()

          print('## All direct calls to full copy 0x12240cc')
          for a,i,op,l in ins:
              if re.search(r'\bcall\s+12240cc\b',op):
                  print(f'### caller 0x{a:x} FDE={fde(a)}')
                  print(ctx(a,15,28))
                  print()

          # Search for candidate vptr materializations in source builder and nearby object constructors.
          highs=[]
          fr=fde(0x122385e)
          if fr:
              for a,i,op,l in body(fr):
                  m=re.search(r'#\s*(18[0-9a-f]{5,}|19[0-9a-f]{5,})\b',l)
                  if m: highs.append(int(m.group(1),16))
          print('## Candidate APs and +0x140 from source-builder constants')
          seen=set()
          for va in sorted(set(highs)):
              for ap in range(max(0,va-0x20),va+0x21,8):
                  if ap in seen:continue
                  vals={off:q(ap+off) for off in range(0,0x160,8)}
                  code=sum(1 for v in vals.values() if v and 0x900000<=v<0x1800000 and fde(v))
                  if code<8: continue
                  seen.add(ap)
                  v140=vals.get(0x140)
                  print(f'### AP 0x{ap:x} codeSlots={code} +0x140={(hex(v140) if v140 else None)} FDE={fde(v140) if v140 else None}')
                  for off in (0,8,0x10,0x18,0x20,0x28,0x30,0x38,0x40,0x138,0x140,0x148):
                      v=vals.get(off); print(f'- +0x{off:x}: {(hex(v) if v is not None else None)}')
                  if v140 and fde(v140):
                      print('#### +0x140 body')
                      for x in body(fde(v140)): print('    '+x[3])
                  print()

          # If source builder does not materialize vptr, find first-word source copied into destination.
          print('## First-word copy provenance')
          for target in (0x122385e,0x12240f8):
              fr=fde(target)
              if not fr:continue
              print(f'### function 0x{target:x}')
              for a,i,op,l in body(fr):
                  if re.search(r'\[(?:rdi|rbx|r12|r13|r14|r15)\]',op) and re.match(r'(mov|movups|movdqu|movaps|movdqa)',op):
                      print('    '+l)
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/final-skip-ad-receiver-vptr.md
          git diff --cached --quiet && exit 0
          git commit -m "Resolve final Skip Ad receiver vptr"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

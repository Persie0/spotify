name: Decode readiness receiver subobject

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decode-readiness-receiver-subobject.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/rsub
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/rsub
      - name: Decode
        run: |
          set -euo pipefail
          SO=/tmp/rsub/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/rsub/all.dis
          readelf -rW "$SO" > /tmp/rsub/rel.txt
          readelf -W -l "$SO" > /tmp/rsub/ph.txt
          python3 - <<'PY' > analysis/skip-ad-readiness-receiver-subobject.md
          from pathlib import Path
          import re,struct,bisect
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/rsub/liborbit-jni-spotify.so')
          data=so.read_bytes()
          lines=Path('/tmp/rsub/all.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m:ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]

          with so.open('rb') as f:
            elf=ELFFile(f);dwarf=elf.get_dwarf_info();fdes=[];loads=[];rel={}
            for seg in elf.iter_segments():
              if seg['p_type']=='PT_LOAD':loads.append((seg['p_offset'],seg['p_offset']+seg['p_filesz'],seg['p_vaddr']))
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location'];z=a+e['address_range']
                if z>a:fdes.append((a,z))
            for sec in elf.iter_sections():
              if sec['sh_type'] not in ('SHT_RELA','SHT_REL'):continue
              for rr in sec.iter_relocations():
                add=rr.entry.get('r_addend')
                if add is not None:rel[rr['r_offset']]=add
          fdes.sort();starts=[a for a,z in fdes]

          def fde(a):
            k=bisect.bisect_right(starts,a)-1
            if k>=0 and fdes[k][0]<=a<fdes[k][1]:return fdes[k]
          def idx(a):return bisect.bisect_left(addrs,a)
          def ctx(a,b=12,n=24):
            j=idx(a)
            for x in ins[max(0,j-b):min(len(ins),j+n+1)]:print('    '+x[3])
          def body(fr):
            j=idx(fr[0]);out=[]
            for x in ins[j:]:
              if x[0]>=fr[1]:break
              out.append(x)
            return out
          def vo(v):
            for po,pe,pv in loads:
              if pv<=v<pv+(pe-po):return po+(v-pv)
          def q(v):
            if v in rel:return rel[v]
            o=vo(v)
            if o is None or o+8>len(data):return None
            return struct.unpack_from('<Q',data,o)[0]

          target=0xf419b4
          fr=fde(target)
          print('# Skip Ad readiness receiver subobject')
          print()
          print('Proven construction chain:')
          print('- allocate 0x90 at 0xefb746 -> base r14')
          print('- base vptr 0x183be98 at 0xefb757')
          print('- r15 = base+0x20 at 0xefb7a5..0xefb7a8')
          print('- construct subobject via 0xf419b4(r15, xmm0)')
          print('- later store r15 into adapter outer+0x58')
          print('- fd381a sees that as adapter this+0x40 and calls receiver vtable +0x140')
          print()
          print(f'## f419b4 FDE={fr}')
          if fr:
            for a,i,op,l in body(fr):print('    '+l)
          print()

          print('## High-address constants / vptr stores in f419b4')
          highs=[]
          if fr:
            rows=body(fr)
            for k,(a,i,op,l) in enumerate(rows):
              m=re.search(r'#\s*(18[0-9a-f]{5,}|19[0-9a-f]{5,})\b',l)
              if m:
                va=int(m.group(1),16);highs.append(va)
                print(f'### 0x{a:x}: {op} -> 0x{va:x}')
                ctx(a,8,14)
                print()
          print()

          print('## Candidate vtables and +0x140')
          seen=set()
          for va in sorted(set(highs)):
            for ap in range(max(0,va-0x20),va+0x21,8):
              if ap in seen:continue
              vals={off:q(ap+off) for off in range(0,0x160,8)}
              code=sum(1 for v in vals.values() if v is not None and 0x900000<=v<0x1800000 and fde(v))
              if code<8:continue
              seen.add(ap)
              v140=vals.get(0x140)
              print(f'### AP 0x{ap:x}; codeSlots={code}; +0x140={("0x%x"%v140) if v140 else None}; FDE={fde(v140) if v140 else None}')
              for off in (0,8,0x10,0x18,0x20,0x28,0x30,0x38,0x40,0x70,0x100,0x120,0x138,0x140,0x148):
                v=vals.get(off);print(f'- +0x{off:x}: {("0x%x"%v) if v is not None else None}')
              if v140 and fde(v140):
                print('#### +0x140 body')
                for a,i,op,l in body(fde(v140)):print('    '+l)
              print()

          print('## Direct stores to receiver first word in f419b4 callers')
          for a,i,op,l in ins:
            if re.search(r'call\s+f419b4\b',op):
              print(f'### caller 0x{a:x}; FDE={fde(a)}')
              ctx(a,20,30);print()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/skip-ad-readiness-receiver-subobject.md
          git diff --cached --quiet && exit 0
          git commit -m "Decode readiness receiver subobject"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

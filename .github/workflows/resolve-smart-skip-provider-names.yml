name: Resolve smart skip interval provider names

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/resolve-smart-skip-provider-names.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/skipnames
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/skipnames

      - name: Install helper
        run: python3 -m pip install --quiet pyelftools

      - name: Back-slice provider inputs
        run: |
          SO=/tmp/skipnames/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/skipnames/all.dis
          python3 - <<'PY' > analysis/smart-skip-provider-names.md
          from pathlib import Path
          import re,bisect
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/skipnames/liborbit-jni-spotify.so')
          data=so.read_bytes()
          lines=Path('/tmp/skipnames/all.dis').read_text(errors='replace').splitlines()

          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m:ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]

          with so.open('rb') as f:
            elf=ELFFile(f)
            loads=[]
            for s in elf.iter_segments():
              if s['p_type']=='PT_LOAD':
                loads.append((s['p_offset'],s['p_offset']+s['p_filesz'],s['p_vaddr']))
            dwarf=elf.get_dwarf_info()
            fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location']; z=a+e['address_range']
                if z>a:fdes.append((a,z))
          fdes.sort(); starts=[a for a,z in fdes]

          def fde(a):
            k=bisect.bisect_right(starts,a)-1
            if k>=0 and fdes[k][0]<=a<fdes[k][1]: return fdes[k]
          def idx(a): return bisect.bisect_left(addrs,a)
          def ctx(a,b=20,n=40):
            j=idx(a)
            for x in ins[max(0,j-b):min(len(ins),j+n+1)]: print('    '+x[3])
          def vaoff(v):
            for po,pe,pv in loads:
              if pv<=v<pv+(pe-po): return po+(v-pv)
          def cstr(v,cap=500):
            o=vaoff(v)
            if o is None:return None
            e=data.find(b'\0',o,min(len(data),o+cap))
            if e<0:return None
            try:return data[o:e].decode('utf8')
            except:return None

          start,end=0x135c878,0x135d056
          rows=[x for x in ins if start<=x[0]<end]

          print('# Smart Skip interval provider names')
          print()
          print('Proven final mapping:')
          print('- dependency+0xb08 <- constructor arg rcx <- factory [rsp+0x1b8]')
          print('- dependency+0xb10 <- constructor stack arg +0x48 <- factory [rsp+0x190]')
          print()

          for slot in (0x1b8,0x190):
            print(f'## Factory slot rsp+0x{slot:x}')
            hits=[]
            for a,i,op,l in rows:
              if f'rsp+0x{slot:x}]' in op:
                hits.append((a,i,op,l))
            for a,i,op,l in hits:
              print(f'### 0x{a:x}: {op}')
              ctx(a,28,55); print()

          # Trace all stores INTO these slots, then identify call/virtual-call return value immediately preceding.
          print('## Definitions of provider slots')
          for slot in (0x1b8,0x190):
            pat=f'[rsp+0x{slot:x}]'
            for k,(a,i,op,l) in enumerate(rows):
              left=op.split(',',1)[0]
              if pat not in left: continue
              if not re.match(r'(mov|xchg|lea)',op): continue
              print(f'### slot 0x{slot:x} write @0x{a:x}: {op}')
              # register source, look backwards for its producer
              src=op.split(',',1)[1].strip() if ',' in op else ''
              regm=re.match(r'(r(?:ax|bx|cx|dx|si|di|8|9|10|11|12|13|14|15|bp))$',src)
              if regm:
                reg=regm.group(1)
                print(f'- source register: {reg}')
                for aa,ii,oo,ll in reversed(rows[max(0,k-35):k]):
                  if re.match(r'(?:mov|lea|pop)\s+'+re.escape(reg)+r'\b',oo) or (reg=='rax' and re.search(r'\bcall\b',oo)):
                    print(f'- nearest producer @0x{aa:x}: {oo}')
                    ctx(aa,12,22)
                    break
              print()

          # Find all calls within 60 instructions before each slot write and decode nearby literal strings.
          print('## Candidate provider-producing calls and nearby strings')
          for slot in (0x1b8,0x190):
            pat=f'[rsp+0x{slot:x}]'
            for k,(a,i,op,l) in enumerate(rows):
              if pat not in op.split(',',1)[0]: continue
              print(f'### slot 0x{slot:x} write @0x{a:x}')
              window=rows[max(0,k-70):k+1]
              for aa,ii,oo,ll in window:
                if re.search(r'\bcall\b',oo):
                  print(f'- call @0x{aa:x}: {oo}')
                m=re.search(r'#\s*([0-9a-f]+)\b',ll)
                if m:
                  s=cstr(int(m.group(1),16))
                  if s and 2<=len(s)<=200:
                    print(f'- string @0x{aa:x}: {s!r}')
              print()

          # Registry accessors in factory: correlate ID checks with stack slots.
          print('## Registry/service ID accesses in factory')
          for a,i,op,l in rows:
            if re.search(r'call\s+b622de\b',op):
              print(f'### registry ID check @0x{a:x}')
              ctx(a,12,18); print()
            if re.search(r'mov\s+edx,0x[0-9a-f]+',op):
              # only show near b622de
              j=idx(a)
              around=[x for x in ins[j:min(len(ins),j+8)]]
              if any(re.search(r'call\s+b622de\b',x[2]) for x in around):
                print(f'### ID setup @0x{a:x}: {op}')
                ctx(a,8,14); print()

          # Direct helper/accessor calls whose return is persisted into local source slots.
          print('## Stack-slot assignment table in factory')
          for a,i,op,l in rows:
            m=re.match(r'mov\s+QWORD PTR \[rsp\+0x([0-9a-f]+)\],(r\w+)',op)
            if m:
              off=int(m.group(1),16)
              if 0x100<=off<=0x1d0:
                print(f'- 0x{a:x}: stack+0x{off:x} <- {m.group(2)}')

          # Print all printable literals directly referenced in factory.
          print()
          print('## Factory string literals')
          seen=set()
          for a,i,op,l in rows:
            m=re.search(r'#\s*([0-9a-f]+)\b',l)
            if not m:continue
            s=cstr(int(m.group(1),16))
            if s and 3<=len(s)<=300 and s not in seen:
              seen.add(s)
              print(f'- 0x{a:x}: {s!r}')
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/smart-skip-provider-names.md
          git diff --cached --quiet && exit 0
          git commit -m "Resolve smart skip interval provider names"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main &&
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

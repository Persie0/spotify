name: Trace Orbit ad skip guard

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/native-ad-guard-xrefs.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/native
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-*.apk" --dir input
          APK="$(find input -type f -name '*.apk' -print -quit)"
          unzip -j "$APK" 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/native

      - name: Install helper
        run: python3 -m pip install --quiet pyelftools

      - name: Trace guard offset and builder callers
        run: |
          SO=/tmp/native/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/orbit.disasm
          readelf -lW "$SO" > /tmp/phdr.txt

          cat > /tmp/trace.py <<'PY'
          from pathlib import Path
          import re
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/native/liborbit-jni-spotify.so')
          data=so.read_bytes()
          dis=Path('/tmp/orbit.disasm').read_text(errors='replace').splitlines()

          with so.open('rb') as f:
            elf=ELFFile(f)
            loads=[]
            for seg in elf.iter_segments():
              if seg['p_type']=='PT_LOAD':
                loads.append((seg['p_offset'],seg['p_offset']+seg['p_filesz'],seg['p_vaddr']))
            def va2off(va):
              for a,b,v in loads:
                if v <= va < v+(b-a): return a+(va-v)
              return va if 0 <= va < len(data) else None
            dwarf=elf.get_dwarf_info()
            fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location']; b=a+e['address_range']
                if b>a: fdes.append((a,b))
            fdes.sort()

          def fde_for(addr):
            lo,hi=0,len(fdes)
            while lo<hi:
              m=(lo+hi)//2
              if fdes[m][0] <= addr: lo=m+1
              else: hi=m
            for k in range(max(0,lo-5),min(len(fdes),lo+2)):
              a,b=fdes[k]
              if a<=addr<b:return (a,b)
            return None

          def cstring(va,maxlen=240):
            off=va2off(va)
            if off is None or off>=len(data): return None
            end=data.find(b'\0',off,min(len(data),off+maxlen))
            if end<0:return None
            raw=data[off:end]
            if len(raw)<3:return None
            if sum(32<=x<127 or x in (9,10,13) for x in raw)/len(raw)<.96:return None
            try:return raw.decode()
            except:return None

          ins=[]
          for i,line in enumerate(dis):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',line)
            if m: ins.append((int(m.group(1),16),i,m.group(2),line))

          guard=[]
          for addr,i,op,line in ins:
            if re.search(r'\+0x470\]',op):
              fr=fde_for(addr)
              before=op.split(',',1)[0]
              is_write=bool(re.match(r'^(mov|movzx|movsx|and|or|xor|inc|dec|add|sub|cmpxchg|xchg)\b',op)) and '[' in before
              guard.append((addr,i,op,fr,is_write))

          # Functions that mention both the ad guard and the broad active-context flag.
          funcs={}
          for addr,i,op,line in ins:
            fr=fde_for(addr)
            if not fr: continue
            if re.search(r'\+0x(470|598|438|14a0)\]',op):
              funcs.setdefault(fr,set()).update(re.findall(r'\+0x(470|598|438|14a0)\]',op))

          # Direct calls/jumps to the known restriction builder start.
          callers=[]
          for addr,i,op,line in ins:
            if re.search(r'\b(call|jmp)\s+10a6464\b',op):
              callers.append((addr,i,op,fde_for(addr)))

          print('# Orbit ad skip guard trace')
          print()
          print('Known restriction builder: 0x10a6464..0x10a7f52')
          print('Known ad skip-next container: r14+0x14a0')
          print('Known ad skip guard in that builder: r14+0x470')
          print()

          print('## All +0x470 memory references')
          print()
          print(f'Total references: {len(guard)}; syntactic writes: {sum(x[4] for x in guard)}')
          print()
          for addr,i,op,fr,is_write in guard:
            ftxt=f'0x{fr[0]:x}..0x{fr[1]:x}' if fr else 'unknown'
            print(f'### 0x{addr:x} ({ftxt})' + (' WRITE' if is_write else ''))
            for l in dis[max(0,i-10):min(len(dis),i+12)]:
              print('    '+l)
            print()

          print('## Candidate same-object functions')
          print()
          for fr,offs in sorted(funcs.items()):
            if '470' in offs:
              print(f'- 0x{fr[0]:x}..0x{fr[1]:x}: offsets '+', '.join('0x'+x for x in sorted(offs)))

          print()
          print('## Direct callers of 0x10a6464')
          print()
          if not callers:
            print('- none found; likely invoked indirectly/virtually or function boundary is an internal method body')
          for addr,i,op,fr in callers:
            ftxt=f'0x{fr[0]:x}..0x{fr[1]:x}' if fr else 'unknown'
            print(f'### 0x{addr:x} from {ftxt}')
            for l in dis[max(0,i-12):min(len(dis),i+13)]:
              print('    '+l)
            print()

          # Printable RIP-relative strings inside any function with a +0x470 reference.
          candidate_ranges=sorted({x[3] for x in guard if x[3]})
          print('## Printable strings in +0x470 functions')
          print()
          for fr in candidate_ranges:
            vals=[]
            for addr,i,op,line in ins:
              if not (fr[0] <= addr < fr[1]) or '#' not in line: continue
              m=re.match(r'\s*([0-9a-f]+)\b',line.split('#',1)[1])
              if not m: continue
              st=cstring(int(m.group(1),16))
              if st and st not in vals: vals.append(st)
            print(f'### 0x{fr[0]:x}..0x{fr[1]:x}')
            for st in vals[:120]:
              print('- '+st.replace('\n','\\n'))
            print()
          PY
          python3 /tmp/trace.py > analysis/native-ad-guard-xrefs.md

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/native-ad-guard-xrefs.md
          git diff --cached --quiet && exit 0
          git commit -m "Trace Orbit ad skip guard"
          git pull --rebase origin main
          git push origin HEAD:main

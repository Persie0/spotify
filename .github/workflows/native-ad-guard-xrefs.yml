name: Trace Orbit ad skip guard

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/native-ad-guard-xrefs.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/native
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-*.apk" --dir input
          APK="$(find input -type f -name '*.apk' -print -quit)"
          unzip -j "$APK" 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/native

      - name: Install helper
        run: python3 -m pip install --quiet pyelftools

      - name: Trace guard offset and builder callers
        run: |
          SO=/tmp/native/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/orbit.disasm
          readelf -lW "$SO" > /tmp/phdr.txt

          cat > /tmp/trace.py <<'PY'
          from pathlib import Path
          import re
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/native/liborbit-jni-spotify.so')
          data=so.read_bytes()
          dis=Path('/tmp/orbit.disasm').read_text(errors='replace').splitlines()

          with so.open('rb') as f:
            elf=ELFFile(f)
            loads=[]
            for seg in elf.iter_segments():
              if seg['p_type']=='PT_LOAD':
                loads.append((seg['p_offset'],seg['p_offset']+seg['p_filesz'],seg['p_vaddr']))
            def va2off(va):
              for a,b,v in loads:
                if v <= va < v+(b-a): return a+(va-v)
              return va if 0 <= va < len(data) else None
            dwarf=elf.get_dwarf_info()
            fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location']; b=a+e['address_range']
                if b>a: fdes.append((a,b))
            fdes.sort()

          def fde_for(addr):
            lo,hi=0,len(fdes)
            while lo<hi:
              m=(lo+hi)//2
              if fdes[m][0] <= addr: lo=m+1
              else: hi=m
            for k in range(max(0,lo-5),min(len(fdes),lo+2)):
              a,b=fdes[k]
              if a<=addr<b:return (a,b)
            return None

          def cstring(va,maxlen=240):
            off=va2off(va)
            if off is None or off>=len(data): return None
            end=data.find(b'\0',off,min(len(data),off+maxlen))
            if end<0:return None
            raw=data[off:end]
            if len(raw)<3:return None
            if sum(32<=x<127 or x in (9,10,13) for x in raw)/len(raw)<.96:return None
            try:return raw.decode()
            except:return None

          ins=[]
          for i,line in enumerate(dis):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',line)
            if m: ins.append((int(m.group(1),16),i,m.group(2),line))

          tracked_offsets={'438','470','598','14a0','1488','14b8'}
          stack_bases={'rsp','rbp','esp','ebp'}
          mem_re=re.compile(r'\[([a-z][a-z0-9]*)\+0x(438|470|598|14a0|1488|14b8)\]')
          write_ops={'mov','movb','movw','movl','movq','and','or','xor','inc','dec','add','sub','cmpxchg','xchg','bts','btr','btc'}

          def opcode(op):
            return op.split(None,1)[0].lower() if op.strip() else ''

          def first_operand(op):
            parts=op.split(None,1)
            if len(parts)<2:return ''
            return parts[1].split(',',1)[0].strip()

          def object_refs(op):
            # Ignore stack-frame coincidences, RIP-relative constants, vtable
            # dispatch and LEA-only address arithmetic.
            if opcode(op) in {'call','jmp','lea'}:
              return []
            out=[]
            for m in mem_re.finditer(op):
              base,off=m.group(1),m.group(2)
              if base in stack_bases or base=='rip':
                continue
              out.append((base,off))
            return out

          def is_direct_field_write(op,base,off):
            if opcode(op) not in write_ops:
              return False
            dst=first_operand(op)
            return re.search(r'\['+re.escape(base)+r'\+0x'+re.escape(off)+r'\]',dst) is not None

          guard=[]
          funcs={}
          refs_by_key={}
          for addr,i,op,line in ins:
            fr=fde_for(addr)
            for base,off in object_refs(op):
              is_write=is_direct_field_write(op,base,off)
              if off=='470':
                guard.append((addr,i,op,fr,base,is_write))
              if fr:
                key=(fr,base)
                funcs.setdefault(key,set()).add(off)
                refs_by_key.setdefault(key,[]).append((addr,i,op,off,is_write))

          strong={}
          for key,offs in funcs.items():
            if '470' in offs and ({'598','438','14a0'} & offs):
              strong[key]=offs

          callers={0x10a6464:[],0x10a9668:[]}
          for addr,i,op,line in ins:
            for target in callers:
              if re.search(r'\b(call|jmp)\s+'+format(target,'x')+r'\b',op):
                callers[target].append((addr,i,op,fde_for(addr)))

          print('# Orbit ad skip guard trace')
          print()
          print('Known restriction builder: 0x10a6464..0x10a7f52')
          print('Known ad skip-next container: r14+0x14a0')
          print('Known ad skip guard in that builder: r14+0x470')
          print()

          print('## Plausible object +0x470 references')
          print()
          print(f'Non-stack/non-vtable references: {len(guard)}; direct writes: {sum(x[5] for x in guard)}')
          print()
          for addr,i,op,fr,base,is_write in guard:
            ftxt=f'0x{fr[0]:x}..0x{fr[1]:x}' if fr else 'unknown'
            print(f'- 0x{addr:x} in {ftxt}: {base}+0x470' + (' WRITE' if is_write else '') + f' :: {op}')

          print()
          print('## Direct +0x470 writers')
          print()
          writers=[x for x in guard if x[5]]
          if not writers:
            print('- none found as simple direct stores; producer may copy a larger struct or write through an alias/pointer')
          for addr,i,op,fr,base,is_write in writers:
            ftxt=f'0x{fr[0]:x}..0x{fr[1]:x}' if fr else 'unknown'
            print(f'### 0x{addr:x} ({ftxt}) {base}+0x470')
            for l in dis[max(0,i-10):min(len(dis),i+12)]:
              print('    '+l)
            print()

          print('## Strong same-object candidates')
          print()
          if not strong:
            print('- none')
          for (fr,base),offs in sorted(strong.items(), key=lambda kv:(kv[0][0][0],kv[0][1])):
            print(f'### 0x{fr[0]:x}..0x{fr[1]:x} base={base}')
            print('Offsets: '+', '.join('0x'+x for x in sorted(offs, key=lambda x:int(x,16))))
            print()
            for addr,i,op,off,is_write in refs_by_key[(fr,base)]:
              print(f'- 0x{addr:x}: +0x{off}' + (' WRITE' if is_write else '') + f' :: {op}')
            print()
            for addr,i,op,off,is_write in refs_by_key[(fr,base)]:
              if off!='470': continue
              print(f'Context around +0x470 @ 0x{addr:x}:')
              for l in dis[max(0,i-8):min(len(dis),i+10)]:
                print('    '+l)
              print()

          for target,hits in callers.items():
            print(f'## Direct callers/jumpers of 0x{target:x}')
            print()
            if not hits:
              print('- none found; likely indirect/virtual or reached through a nearby thunk')
            for addr,i,op,fr in hits:
              ftxt=f'0x{fr[0]:x}..0x{fr[1]:x}' if fr else 'unknown'
              print(f'### 0x{addr:x} from {ftxt}')
              for l in dis[max(0,i-12):min(len(dis),i+13)]:
                print('    '+l)
              print()

          # Printable RIP-relative strings only in strong same-object candidates.
          candidate_ranges=sorted({fr for (fr,base) in strong})
          print('## Printable strings in strong same-object functions')
          print()
          for fr in candidate_ranges:
            vals=[]
            for addr,i,op,line in ins:
              if not (fr[0] <= addr < fr[1]) or '#' not in line: continue
              m=re.match(r'\s*([0-9a-f]+)\b',line.split('#',1)[1])
              if not m: continue
              st=cstring(int(m.group(1),16))
              if st and st not in vals: vals.append(st)
            print(f'### 0x{fr[0]:x}..0x{fr[1]:x}')
            for st in vals[:120]:
              print('- '+st.replace('\n','\\n'))
            print()
          PY
          python3 /tmp/trace.py > analysis/native-ad-guard-xrefs.md

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/native-ad-guard-xrefs.md
          git diff --cached --quiet && exit 0
          git commit -m "Trace Orbit ad skip guard"
          git pull --rebase origin main
          git push origin HEAD:main

name: Decode smart skip post-seek report

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decode-smart-skip-post-report.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/skipreport
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/skipreport
      - name: Install
        run: python3 -m pip install --quiet pyelftools
      - name: Decode
        run: |
          SO=/tmp/skipreport/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/skipreport/all.dis
          python3 - <<'PY' > analysis/smart-skip-post-seek-report.md
          from pathlib import Path
          import re,bisect
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/skipreport/liborbit-jni-spotify.so')
          data=so.read_bytes()
          dl=Path('/tmp/skipreport/all.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(dl):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m:ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]
          with so.open('rb') as f:
            elf=ELFFile(f)
            loads=[]
            for s in elf.iter_segments():
              if s['p_type']=='PT_LOAD':loads.append((s['p_offset'],s['p_offset']+s['p_filesz'],s['p_vaddr']))
            dwarf=elf.get_dwarf_info(); fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location'];z=a+e['address_range']
                if z>a:fdes.append((a,z))
          fdes.sort();starts=[a for a,z in fdes]
          def fde(a):
            k=bisect.bisect_right(starts,a)-1
            if k>=0 and fdes[k][0]<=a<fdes[k][1]:return fdes[k]
          def body(a,cap=2500):
            fr=fde(a)
            if not fr:return []
            j=bisect.bisect_left(addrs,fr[0]); out=[]
            for x in ins[j:]:
              if x[0]>=fr[1]:break
              out.append(x)
              if len(out)>=cap:break
            return out
          def vaoff(v):
            for po,pe,pv in loads:
              if pv<=v<pv+(pe-po):return po+(v-pv)
          def cstr(v,cap=500):
            o=vaoff(v)
            if o is None:return None
            e=data.find(b'\0',o,min(len(data),o+cap))
            if e<0:return None
            try:return data[o:e].decode('utf8')
            except:return None
          def ctx(a,b=14,n=30):
            j=bisect.bisect_left(addrs,a)
            for x in ins[max(0,j-b):min(len(ins),j+n)]:print('    '+x[3])

          print('# smartSkipEmbeddedPodcastAd post-seek reporting path')
          print()
          print('Proven call after successful seek:')
          print('  0x1371f7c -> 0x1382662 builds state')
          print('  0x1371f88 literal = smart-skip-embedded-podcast-ad')
          print('  0x1371fa0 -> 0x13825fa(reporter=this+0xd0, sink=this+0x958, label, len=30, state)')
          print('  0x13825fa -> 0x1382113')
          print()

          funcs=[
            (0x13825fa,'label/state wrapper'),
            (0x1382113,'downstream report/action sink'),
            (0x1382662,'post-seek state builder'),
            (0x138298c,'state install/copy helper'),
            (0x13828b8,'state reset/init helper'),
          ]
          for fn,label in funcs:
            print(f'## {label}: 0x{fn:x} FDE={fde(fn)}')
            ss=[]
            for a,i,op,l in body(fn):
              print('    '+l)
              m=re.search(r'#\s*([0-9a-f]+)\b',l)
              if m:
                v=int(m.group(1),16);s=cstr(v)
                if s and 2<=len(s)<=300 and s not in ss:ss.append(s)
            if ss:
              print('### strings')
              for s in ss:print(f'- {s!r}')
            print()
            print('### direct calls')
            for a,i,op,l in body(fn):
              m=re.search(r'\bcall\s+([0-9a-f]+)\b',op)
              if m:print(f'- 0x{a:x} -> 0x{int(m.group(1),16):x}: {op}')
            print()

          print('## Exact 0x1382113 caller argument setup')
          for a,i,op,l in body(0x13825fa):
            if re.search(r'call\s+1382113\b',op):
              ctx(a,35,20);print()

          print('## All callers of 0x13825fa and labels passed nearby')
          for a,i,op,l in ins:
            if not re.search(r'call\s+13825fa\b',op):continue
            print(f'### caller 0x{a:x} FDE={fde(a)}')
            j=bisect.bisect_left(addrs,a)
            for aa,ii,oo,ll in ins[max(0,j-22):min(len(ins),j+14)]:
              print('    '+ll)
              m=re.search(r'#\s*([0-9a-f]+)\b',ll)
              if m:
                s=cstr(int(m.group(1),16))
                if s:print(f'      STRING={s!r}')
            print()

          print('## Strings in direct callees of 0x1382113')
          seen=set()
          for a,i,op,l in body(0x1382113):
            m=re.search(r'\bcall\s+([0-9a-f]+)\b',op)
            if not m:continue
            t=int(m.group(1),16)
            if t in seen:continue
            seen.add(t)
            ss=[]
            for aa,ii,oo,ll in body(t,1200):
              mm=re.search(r'#\s*([0-9a-f]+)\b',ll)
              if mm:
                s=cstr(int(mm.group(1),16))
                if s and 2<=len(s)<=300 and s not in ss:ss.append(s)
            if ss:
              print(f'### 0x{t:x} FDE={fde(t)}')
              for s in ss[:60]:print(f'- {s!r}')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/smart-skip-post-seek-report.md
          git diff --cached --quiet && exit 0
          git commit -m "Decode smart skip post-seek reporting"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

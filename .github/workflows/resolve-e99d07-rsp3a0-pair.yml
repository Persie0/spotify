name: Resolve e99d07 readiness rsp3a0 pair

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/resolve-e99d07-rsp3a0-pair.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/r3a0
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/r3a0

      - name: Install helper
        run: python3 -m pip install --quiet pyelftools

      - name: Resolve pair producer
        run: |
          SO=/tmp/r3a0/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/r3a0/all.dis
          readelf -rW "$SO" > /tmp/r3a0/rel.txt
          python3 - <<'PY' > analysis/e99d07-readiness-rsp3a0-pair.md
          from pathlib import Path
          import re,bisect
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/r3a0/liborbit-jni-spotify.so')
          lines=Path('/tmp/r3a0/all.dis').read_text(errors='replace').splitlines()

          with so.open('rb') as f:
            elf=ELFFile(f); dwarf=elf.get_dwarf_info(); fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location']; z=a+e['address_range']
                if z>a:fdes.append((a,z))
          fdes.sort(); starts=[a for a,z in fdes]

          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m: ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]

          def fde(a):
            k=bisect.bisect_right(starts,a)-1
            if k>=0 and fdes[k][0]<=a<fdes[k][1]: return fdes[k]
          def idx(a): return bisect.bisect_left(addrs,a)
          def body(fr):
            j=idx(fr[0]); out=[]
            for x in ins[j:]:
              if x[0]>=fr[1]: break
              out.append(x)
            return out
          def ctx(rows,k,b=16,n=28):
            for x in rows[max(0,k-b):min(len(rows),k+n+1)]: print('    '+x[3])

          call=0xe95d35
          cf=fde(call)
          rows=body(cf)
          print('# e99d07 readiness caller rsp+0x3a0/+0x3a8 pair')
          print()
          print('Proven ABI mapping:')
          print('- e99d07 callee [rsp+0x1338] is incoming caller stack arg +0xf8')
          print('- caller 0xe95c3f pushes from its current [rsp+0x2a8]')
          print('- normalized to the caller stable frame, this is stable [rsp+0x3a8]')
          print('- therefore stable pair [rsp+0x3a0,+0x3a8] is the high-value producer target')
          print(f'- caller FDE={cf}')
          print()

          print('## Every direct reference to stable rsp+0x398..0x3b0 before push sequence')
          for k,(a,i,op,l) in enumerate(rows):
            if a>=0xe95bce: break
            if re.search(r'\[rsp\+0x(?:398|3a0|3a8|3b0)\]',op):
              first=op.split(',',1)[0]
              side='WRITE' if re.search(r'\[rsp\+0x(?:398|3a0|3a8|3b0)\]',first) else 'READ'
              print(f'### {side} 0x{a:x}: {op}')
              ctx(rows,k,18,32); print()

          print('## SIMD/direct writes overlapping rsp+0x3a0..0x3af')
          for k,(a,i,op,l) in enumerate(rows):
            if a>=0xe95bce: break
            # direct stores beginning at 3a0 or 398 may overlap 3a8
            if any(s in op for s in ('[rsp+0x398]','[rsp+0x3a0]','[rsp+0x3a8]')):
              first=op.split(',',1)[0]
              if '[' in first and re.match(r'(mov|movq|movups|movaps|movdqu|movdqa|movlps|movhps|pextrq)',op):
                print(f'### 0x{a:x}: {op}')
                ctx(rows,k,14,24); print()

          print('## LEA aliases formed to rsp+0x3a0 / nearby pair')
          alias_sites=[]
          for k,(a,i,op,l) in enumerate(rows):
            if a>=0xe95bce: break
            m=re.match(r'lea\s+(r\w+),\[rsp\+0x(398|3a0|3a8|3b0)\]',op)
            if not m: continue
            reg,off=m.group(1),int(m.group(2),16)
            alias_sites.append((k,a,reg,off))
            print(f'### 0x{a:x}: {reg}=rsp+0x{off:x}')
            ctx(rows,k,12,28); print()

          print('## Alias uses until register redefinition')
          for k,a,reg,off in alias_sites:
            print(f'### alias {reg} from 0x{a:x} -> rsp+0x{off:x}')
            for kk in range(k+1,min(len(rows),k+180)):
              aa,ii,oo,ll=rows[kk]
              if aa>=0xe95bce: break
              # stop at obvious full-register overwrite, but allow memory uses
              if re.match(r'(mov|lea|pop|xor|and|or)\s+'+re.escape(reg)+r'\b',oo):
                print(f'    [redef] {ll}'); break
              if re.search(r'\b'+re.escape(reg)+r'\b',oo):
                print('    '+ll)
            print()

          print('## Last 0x1400 bytes before outgoing push sequence')
          for a,i,op,l in rows:
            if 0xe94700<=a<0xe95bce:
              print(l)
          print()

          print('## Focus: e953f0..e95540 around known pair read')
          for a,i,op,l in rows:
            if 0xe953f0<=a<0xe95540: print(l)
          print()

          # Track common copy helpers called with rdi/first arg = &rsp+0x3a0.
          print('## Calls where immediately prior instructions form/pass rsp+0x3a0 address')
          for k,(a,i,op,l) in enumerate(rows):
            if a>=0xe95bce: break
            if not re.search(r'\bcall\b',op): continue
            prev='\n'.join(x[2] for x in rows[max(0,k-10):k])
            if 'rsp+0x3a0' in prev or 'rsp+0x3a8' in prev:
              print(f'### call 0x{a:x}: {op}')
              ctx(rows,k,12,20); print()

          # Candidate first qword objects from pair copies: if a 16-byte source is copied into rsp+3a0,
          # show the source register definition and nearby vptr/high constants.
          print('## Backslice direct pair stores')
          for k,(a,i,op,l) in enumerate(rows):
            if a>=0xe95bce: break
            first=op.split(',',1)[0]
            if '[rsp+0x3a0]' not in first: continue
            print(f'### store 0x{a:x}: {op}')
            # source reg/xmm is RHS if present
            rhs=op.split(',',1)[1].strip() if ',' in op else ''
            print(f'- rhs={rhs}')
            for x in rows[max(0,k-45):min(len(rows),k+12)]: print('    '+x[3])
            print()

          print('## High-address/vptr materializations near final producer region')
          for k,(a,i,op,l) in enumerate(rows):
            if not (0xe94700<=a<0xe95bce): continue
            m=re.search(r'#\s*(18[0-9a-f]{5,}|19[0-9a-f]{5,})\b',l)
            if m:
              print(f'### 0x{a:x}: {op}')
              ctx(rows,k,5,10); print()
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/e99d07-readiness-rsp3a0-pair.md
          git diff --cached --quiet && exit 0
          git commit -m "Resolve e99d07 readiness rsp3a0 pair"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

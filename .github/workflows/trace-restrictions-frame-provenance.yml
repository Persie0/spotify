name: Trace Restrictions constructor frame provenance

on:
  push:
    paths:
      - '.github/workflows/trace-restrictions-frame-provenance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download r1 --repo Persie0/spotify --pattern 'spotify-9-1-84-2205.apk' --clobber
          unzip -p spotify-9-1-84-2205.apk lib/x86_64/liborbit-jni-spotify.so > liborbit-jni-spotify.so

      - name: Trace constructor frame provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path

          so='liborbit-jni-spotify.so'
          out=Path('analysis'); out.mkdir(exist_ok=True)
          report=out/'restrictions-frame-provenance.md'
          dis=subprocess.check_output(['objdump','-d','-M','intel',so], text=True, errors='replace')
          insn_re=re.compile(r'^\s*([0-9a-f]+):\s+((?:[0-9a-f]{2}\s)+)\s*(.*)$')
          insns=[]
          for line in dis.splitlines():
              m=insn_re.match(line)
              if m: insns.append((int(m.group(1),16), line.rstrip(), m.group(3).strip()))
          ctor=[x for x in insns if 0x10aba36 <= x[0] <= 0x10adc80]
          def fmt(rows): return '```text\n'+'\n'.join(l for _,l,_ in rows)+'\n```\n'
          def table(rows):
              s='| addr | instruction |\n|---:|---|\n'
              for a,l,t in rows: s += f'| `{a:#x}` | `{l.strip()}` |\n'
              return s+'\n'
          def refs(patterns):
              return [(a,l,t) for a,l,t in ctor if any(p in l for p in patterns)]

          slots={
            'rsp+0x40':['rsp+0x40'],
            'rsp+0x70':['rsp+0x70'],
            'rsp+0x28':['rsp+0x28'],
            'rsp+0x60':['rsp+0x60'],
            'rsp+0x80':['rsp+0x80'],
            'rsp+0x110':['rsp+0x110'],
          }
          regs={
            'r15':['r15','r15d'],
            'r14':['r14','r14d'],
            'r13':['r13','r13d'],
            'r12':['r12','r12d'],
            'rbp':['rbp','ebp'],
          }
          event_patterns=['call','rsp+0x40','rsp+0x70','rsp+0x28','rsp+0x60','rsp+0x80','rsp+0x110','r15','184d0a0','184d9a8','184d1f0','184d898','184d808','187e260']
          events=[x for x in ctor if any(p in x[1] for p in event_patterns)]

          # Lightweight register timeline: only instructions mentioning r15 around the tail.
          r15_tail=[x for x in ctor if x[0]>=0x10ac000 and ('r15' in x[1] or '[rsp+0x70]' in x[1] or '[rsp+0x40]' in x[1] or 'call' in x[2])]
          rsp40_back=[x for x in ctor if x[0] <= 0x10ac390 and ('rsp+0x40' in x[1] or 'mov' in x[2] and ('rsp' in x[2] or 'r15' in x[2] or 'r14' in x[2]))]

          md=[]
          md.append('# Restrictions constructor frame provenance\n\n')
          md.append('Parallel trace for unresolved constructor-frame provenance: `[rsp+0x40]`, `r15`, and `[rsp+0x70]`.\n\n')
          md.append('## Slot references in full constructor window\n\n')
          for name,pats in slots.items():
              rows=refs(pats)
              md.append(f'### `{name}` ({len(rows)} refs)\n\n')
              md.append(table(rows[:220]))
          md.append('## Register references in full constructor window\n\n')
          for name,pats in regs.items():
              rows=refs(pats)
              md.append(f'### `{name}` ({len(rows)} refs)\n\n')
              md.append(table(rows[:260]))
          md.append('## Chronological event stream\n\n')
          md.append(table(events[:420]))
          md.append('## Tail-focused r15 / stack-slot timeline\n\n')
          md.append(table(r15_tail[:420]))
          md.append('## Backward context for `[rsp+0x40]` before first vtable+0x28 call\n\n')
          md.append(table(rsp40_back[-260:]))
          md.append('## Questions this report is meant to answer\n\n')
          md.append('- Is `[rsp+0x40]` written in `0x10aba36`, or inherited from an outer caller/frame alias?\n')
          md.append('- What does `r15` denote before `10ac386`, and how does it become the second `vtable+0x28` receiver?\n')
          md.append('- Does `[rsp+0x70]` become the final constructor output or merely a temporary local holder?\n')
          report.write_text(''.join(md),encoding='utf-8')
          print(report)
          PY

      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/restrictions-frame-provenance.md
          git commit -m 'Trace Restrictions constructor frame provenance' || exit 0
          git push
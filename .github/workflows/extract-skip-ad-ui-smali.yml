name: Extract Skip Ad UI smali

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/extract-skip-ad-ui-smali.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          echo "APK=input/spotify-9-1-84-2205.apk" >> "$GITHUB_ENV"

      - name: Install apktool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apktool

      - name: Decode smali
        run: |
          rm -rf /tmp/spotify-smali
          apktool d -f -r "$APK" -o /tmp/spotify-smali

      - name: Extract and report
        run: |
          rm -rf analysis/smali-skip-ad
          mkdir -p analysis/smali-skip-ad

          for C in kk21 jo20; do
            F="$(find /tmp/spotify-smali -type f -path "*/p/$C.smali" -print -quit)"
            if [ -z "$F" ]; then
              F="$(find /tmp/spotify-smali -type f -name "$C.smali" -print -quit)"
            fi
            if [ -n "$F" ]; then
              cp "$F" "analysis/smali-skip-ad/$C.smali"
            else
              echo "::warning::$C not found"
            fi
          done

          {
            echo "# Skip Ad UI smali trace"
            echo
            for C in kk21 jo20; do
              F="analysis/smali-skip-ad/$C.smali"
              echo "## $C methods"
              if [ -f "$F" ]; then
                grep -n '^\.method' "$F" || true
                echo
                echo "### Skip/resource/click neighborhoods"
                grep -n -B80 -A160 -E                   '0x7f13273a|0x7f0b0eb1|skip|Click|click|onClick|setOnClickListener|Lp/peu;|Lp/eh00;|Lp/gh00;|invoke-interface|invoke-virtual'                   "$F" | head -n 16000 || true
              fi
              echo
            done

            echo "## All kk21 bytecode xrefs"
            grep -R -n -B35 -A60 --include='*.smali' -E 'Lp/kk21;->|new-instance .*Lp/kk21;'               /tmp/spotify-smali/smali* 2>/dev/null | head -n 18000 || true
            echo

            echo "## All jo20 bytecode xrefs"
            grep -R -n -B45 -A80 --include='*.smali' -E 'Lp/jo20;->|new-instance .*Lp/jo20;'               /tmp/spotify-smali/smali* 2>/dev/null | head -n 22000 || true
            echo
          } > analysis/smali-skip-ad/xrefs.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/smali-skip-ad
          git diff --cached --quiet && exit 0
          git commit -m "Extract Skip Ad UI smali"
          git pull --rebase origin main
          git push origin HEAD:main

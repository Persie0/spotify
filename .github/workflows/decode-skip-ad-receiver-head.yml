name: Decode Skip Ad receiver head copy

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decode-skip-ad-receiver-head.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/headcopy
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/headcopy
      - name: Decode
        run: |
          SO=/tmp/headcopy/liborbit-jni-spotify.so
          {
            echo '# Skip Ad 0x6b0 receiver head copy'
            echo
            echo '## 0x12240f8 exact'
            objdump -d -M intel --start-address=0x12240f8 --stop-address=0x12244a0 "$SO"
            echo
            echo '## 0x108dcd4 tail copy'
            objdump -d -M intel --start-address=0x108dcd4 --stop-address=0x108e180 "$SO"
            echo
            echo '## Head qword stores/copies'
            objdump -d -M intel --start-address=0x12240f8 --stop-address=0x12244a0 "$SO" | grep -E '\[(rdi|rbx|r12|r13|r14|r15)(\+0x[0-9a-f]+)?\]' || true
            echo
            echo '## High address constants'
            objdump -d -M intel --start-address=0x12240f8 --stop-address=0x12244a0 "$SO" | grep -E '# 18[0-9a-f]{5,}|# 19[0-9a-f]{5,}' || true
          } > analysis/skip-ad-6b0-head-copy.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/skip-ad-6b0-head-copy.md
          git diff --cached --quiet && exit 0
          git commit -m "Decode Skip Ad receiver head copy"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

name: Decode TimelineAds scalar predicate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decode-timelineads-scalar-predicate.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/tadspred
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/tadspred
      - name: Decode
        run: |
          SO=/tmp/tadspred/liborbit-jni-spotify.so
          {
            echo '# TimelineAds scalar predicate candidates'
            echo
            echo '## Exact 0xa3fa60'
            objdump -d -M intel --start-address=0xa3fa50 --stop-address=0xa3fa80 "$SO"
            echo
            echo '## TimelineAds wrapper AP 0x18678f8 relocations'
            readelf -rW "$SO" | awk '$1>="00000000018678d0" && $1<="0000000001867a80"'
            echo
            echo '## 0x90 readiness-state vptrs in true branch'
            objdump -d -M intel --start-address=0x1352760 --stop-address=0x135290b "$SO"
            echo
            echo '## vptr/high refs in true branch'
            objdump -d -M intel --start-address=0x1352760 --stop-address=0x135290b "$SO" | grep -E '# 18[0-9a-f]{5,}|# 19[0-9a-f]{5,}' || true
          } > analysis/timelineads-scalar-predicate.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/timelineads-scalar-predicate.md
          git diff --cached --quiet && exit 0
          git commit -m "Decode TimelineAds scalar predicate"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 1
          done
          exit 1

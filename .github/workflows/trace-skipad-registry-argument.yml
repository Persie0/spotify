name: Trace skipad registry argument

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trace-skipad-registry-argument.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true
      - name: Download and trace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/regarg
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/regarg
          objdump -d -M intel /tmp/regarg/liborbit-jni-spotify.so > /tmp/regarg/all.dis
          {
            echo '# Skip Ad registry argument provenance'
            echo
            echo '## 0x11ee608 entry'
            objdump -d -M intel --start-address=0x11ee608 --stop-address=0x11ee690 /tmp/regarg/liborbit-jni-spotify.so
            echo
            echo '## Direct callers of 0x11ee608'
            grep -n -E -B80 -A30 'call[[:space:]]+11ee608\b' /tmp/regarg/all.dis | head -n 30000 || true
            echo
            echo '## Tail jumps to 0x11ee608'
            grep -n -E -B40 -A12 'jmp[[:space:]]+11ee608\b' /tmp/regarg/all.dis | head -n 12000 || true
          } > analysis/skipad-registry-argument.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/skipad-registry-argument.md
          git diff --cached --quiet && exit 0
          git commit -m "Trace Skip Ad registry argument"
          git pull --rebase origin main
          git push origin HEAD:main

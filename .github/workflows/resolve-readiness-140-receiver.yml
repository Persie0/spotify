name: Resolve readiness +0x140 receiver

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/resolve-readiness-140-receiver.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/r140
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/r140
      - name: Install
        run: python3 -m pip install --quiet pyelftools
      - name: Trace receiver
        run: |
          SO=/tmp/r140/liborbit-jni-spotify.so
          objdump -d -M intel --start-address=0xefb500 --stop-address=0xefc730 "$SO" > /tmp/r140/win.dis
          objdump -d -M intel "$SO" > /tmp/r140/all.dis
          readelf -rW "$SO" > /tmp/r140/rel.txt
          {
            echo '# Skip Ad readiness +0x140 receiver'
            echo
            echo 'Proven handoff: 0xefc701 stores r15 into signal-owner outer+0x58; adapter this+0x40 therefore points to r15. Last r15 definition is 0xefb7a5: r15=r14.'
            echo
            echo '## Focus window efb500..efc730'
            cat /tmp/r140/win.dis
            echo
            echo '## r14/r15 definitions'
            grep -E '^[[:space:]]*[0-9a-f]+:.*[[:space:]](mov|lea|pop|xchg)[[:space:]]+(r14|r15)([^a-zA-Z0-9]|$)' /tmp/r140/win.dis || true
            echo
            echo '## allocations / vptr-looking stores'
            grep -E -B12 -A28 '17edf00|# 18[0-9a-f]{5,}' /tmp/r140/win.dis || true
          } > analysis/skip-ad-readiness-140-receiver.md

          python3 - <<'PY' >> analysis/skip-ad-readiness-140-receiver.md
          from pathlib import Path
          import re,struct
          from elftools.elf.elffile import ELFFile

          so=Path('/tmp/r140/liborbit-jni-spotify.so')
          data=so.read_bytes()
          dis=Path('/tmp/r140/all.dis').read_text(errors='replace').splitlines()
          with so.open('rb') as f:
            elf=ELFFile(f);loads=[];rel={}
            for s in elf.iter_segments():
              if s['p_type']=='PT_LOAD':loads.append((s['p_offset'],s['p_offset']+s['p_filesz'],s['p_vaddr']))
            for sec in elf.iter_sections():
              if sec['sh_type'] not in ('SHT_RELA','SHT_REL'):continue
              for rr in sec.iter_relocations():
                add=rr.entry.get('r_addend')
                if add is not None:rel[rr['r_offset']]=add

          ins=[]
          for i,l in enumerate(dis):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m:ins.append((int(m.group(1),16),i,m.group(2),l))
          def vo(v):
            for po,pe,pv in loads:
              if pv<=v<pv+(pe-po):return po+(v-pv)
          def q(v):
            if v in rel:return rel[v]
            o=vo(v)
            if o is None or o+8>len(data):return None
            return struct.unpack_from('<Q',data,o)[0]

          # derive last r14 definition before efb7a5
          rows=[x for x in ins if 0xefb500<=x[0]<=0xefb7a5]
          defs=[]
          for x in rows:
            if re.match(r'(mov|lea|pop|xchg)\s+r14\b',x[2]):defs.append(x)
          print()
          print('## Last r14 definitions before r15=r14')
          for a,i,op,l in defs[-12:]:
            print(f'- 0x{a:x}: {op}')
          if defs:
            a,i,op,l=defs[-1]
            print(f'\nFinal r14 source: 0x{a:x}: {op}')
            for x in dis[max(0,i-50):min(len(dis),i+75)]:print('    '+x)

          print()
          print('## Static vtable candidates materialized in focus window')
          highs=[]
          for a,i,op,l in rows:
            m=re.search(r'#\s*(18[0-9a-f]{5,})\b',l)
            if m:
              va=int(m.group(1),16)
              if va not in highs:highs.append(va)
          for va in highs:
            print(f'### around 0x{va:x}')
            for ap in range(max(0,va-0x20),va+0x21,8):
              vals=[q(ap+o) for o in range(0,0x160,8)]
              code=sum(1 for v in vals if v is not None and 0x900000<=v<0x1800000)
              if code<8:continue
              print(f'- AP 0x{ap:x}, codeSlots={code}, +0x140={("0x%x"%q(ap+0x140)) if q(ap+0x140) else None}')
              for off in [0,8,0x10,0x18,0x20,0x28,0x30,0x38,0x40,0x70,0x100,0x120,0x138,0x140,0x148]:
                v=q(ap+off)
                print(f'  - +0x{off:x}: {("0x%x"%v) if v is not None else None}')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/skip-ad-readiness-140-receiver.md
          git diff --cached --quiet && exit 0
          git commit -m "Resolve readiness +0x140 receiver"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

name: Decode TimelineConductor skip-ad operation semantics

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decode-timeline-skipad-semantics.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/tlsem
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/tlsem

      - name: Install helper
        run: python3 -m pip install --quiet pyelftools

      - name: Decode semantics
        run: |
          SO=/tmp/tlsem/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/tlsem/all.dis
          python3 - <<'PY' > analysis/timeline-conductor-skipad-semantics.md
          from pathlib import Path
          import re,bisect
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/tlsem/liborbit-jni-spotify.so')
          data=so.read_bytes()
          dl=Path('/tmp/tlsem/all.dis').read_text(errors='replace').splitlines()

          with so.open('rb') as f:
            elf=ELFFile(f)
            loads=[]
            for s in elf.iter_segments():
              if s['p_type']=='PT_LOAD':
                loads.append((s['p_offset'],s['p_offset']+s['p_filesz'],s['p_vaddr']))
            dwarf=elf.get_dwarf_info()
            fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location']; z=a+e['address_range']
                if z>a:fdes.append((a,z))
          fdes.sort(); starts=[x[0] for x in fdes]

          ins=[]
          for i,l in enumerate(dl):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m:ins.append((int(m.group(1),16),i,m.group(2),l))

          def fde(a):
            i=bisect.bisect_right(starts,a)-1
            if i>=0 and fdes[i][0]<=a<fdes[i][1]:return fdes[i]
          def va2off(v):
            for po,pe,pv in loads:
              if pv<=v<pv+(pe-po):return po+(v-pv)
          def cstr(v,lim=512):
            o=va2off(v)
            if o is None:return None
            e=data.find(b'\0',o,min(len(data),o+lim))
            if e<0:return None
            raw=data[o:e]
            try:return raw.decode('utf-8')
            except:return repr(raw)
          def strings_near(v,span=0x100):
            o=va2off(v)
            if o is None:return []
            lo=max(0,o-span); hi=min(len(data),o+span)
            out=[]
            for m in re.finditer(rb'[ -~]{3,}',data[lo:hi]):
              sva=None
              off=lo+m.start()
              for po,pe,pv in loads:
                if po<=off<pe:sva=pv+(off-po);break
              out.append((sva,m.group().decode('ascii','replace')))
            return out
          def body(fn,limit=1200):
            fr=fde(fn)
            if not fr:return []
            return [x for x in ins if fr[0]<=x[0]<fr[1]][:limit]

          print('# TimelineConductor skip-ad operation semantics')
          print()
          print('Proven entry: dependency AP 0x1868200, virtual +0x68 -> 0x1371d90.')
          print()

          for v in [0x371518,0x34d976]:
            print(f'## Exact string VA 0x{v:x}')
            print(f'- cstr: {cstr(v)!r}')
            for a,s in strings_near(v,0x180):
              print(f'- nearby 0x{a:x}: {s!r}')
            print()

          fn=0x1371d90
          print('## Direct calls from +0x68 body')
          calls=[]
          for a,i,op,l in body(fn):
            m=re.search(r'\bcall\s+([0-9a-f]+)\b',op)
            if m:
              t=int(m.group(1),16); calls.append((a,t))
              print(f'- 0x{a:x} -> 0x{t:x}; FDE={fde(t)}')
          print()

          print('## All literal strings referenced by +0x68 and one-hop callees')
          funcs={fn}|{t for _,t in calls}
          seen=set()
          for f in sorted(funcs):
            fr=fde(f)
            if not fr:continue
            refs=[]
            for a,i,op,l in body(f,1800):
              m=re.search(r'#\s*([0-9a-f]+)\b',l)
              if not m:continue
              v=int(m.group(1),16)
              s=cstr(v)
              if s and any(ch.isprintable() for ch in s) and len(s)<=300:
                key=(v,s)
                if key not in seen:
                  seen.add(key);refs.append((a,v,s))
            if refs:
              print(f'### function/FDE containing 0x{f:x}: {fr}')
              for a,v,s in refs:
                print(f'- xref 0x{a:x} -> 0x{v:x}: {s!r}')
              print()

          print('## +0x68 control-flow semantic anchors')
          for a,i,op,l in body(fn):
            if any(x in op for x in ['+0x240]','+0x958]','+0x9b8]','+0xb08]','+0xb10]','+0xd0]']):
              print(l)
          print()

          print('## Exact "skip-ad" literal occurrences and native code xrefs')
          needle=b'skip-ad\0'
          off=0
          while True:
            p=data.find(needle,off)
            if p<0:break
            va=None
            for po,pe,pv in loads:
              if po<=p<pe:va=pv+(p-po);break
            print(f'- literal file+0x{p:x}, VA={hex(va) if va else None}')
            if va:
              for a,i,op,l in ins:
                m=re.search(r'#\s*([0-9a-f]+)\b',l)
                if m and int(m.group(1),16)==va:
                  print(f'  - xref 0x{a:x}; FDE={fde(a)}: {op}')
            off=p+1
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/timeline-conductor-skipad-semantics.md
          git diff --cached --quiet && exit 0
          git commit -m "Decode TimelineConductor skip-ad semantics"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main &&
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

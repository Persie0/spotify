name: Resolve fd4c04 Skip Ad source object

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/resolve-fd4c04-skipad-source.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/fd4src
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/fd4src

      - name: Install helper
        run: python3 -m pip install --quiet pyelftools

      - name: Trace source
        run: |
          SO=/tmp/fd4src/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/fd4src/all.dis
          readelf -rW "$SO" > /tmp/fd4src/rel.txt
          python3 - <<'PY' > analysis/fd4c04-skipad-source.md
          from pathlib import Path
          import re,bisect
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/fd4src/liborbit-jni-spotify.so')
          lines=Path('/tmp/fd4src/all.dis').read_text(errors='replace').splitlines()
          rel_lines=Path('/tmp/fd4src/rel.txt').read_text(errors='replace').splitlines()

          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m:ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]

          with so.open('rb') as f:
            elf=ELFFile(f); dwarf=elf.get_dwarf_info(); fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location']; z=a+e['address_range']
                if z>a:fdes.append((a,z))
          fdes.sort(); starts=[a for a,z in fdes]

          def fde(a):
            k=bisect.bisect_right(starts,a)-1
            if k>=0 and fdes[k][0]<=a<fdes[k][1]:return fdes[k]
          def idx(a):return bisect.bisect_left(addrs,a)
          def ctx(a,b=16,n=30):
            j=idx(a)
            for x in ins[max(0,j-b):min(len(ins),j+n+1)]: print('    '+x[3])
          def body(fr):
            if not fr:return []
            j=idx(fr[0]); out=[]
            for x in ins[j:]:
              if x[0]>=fr[1]:break
              out.append(x)
            return out

          target=0xfd4c04
          print('# fd4c04 Skip Ad source object trace')
          print()
          print('Known field map:')
          print('- materializer fallback: r14 = [rsi+0x10]')
          print('- new adapter outer+0x58 = [r14+0x40]')
          print('- adapter this = outer+0x18, so fd381a this+0x40 = outer+0x58')
          print('- therefore final readiness receiver = [[fd4c04 source wrapper +0x10] +0x40]')
          print()

          print('## fd4c04 exact FDE / body')
          fr=fde(target)
          print(f'FDE={fr}')
          for x in body(fr): print('    '+x[3])
          print()

          print('## Direct call/jump xrefs to fd4c04 or interior fd4c34')
          for a,i,op,l in ins:
            if re.search(r'\b(?:call|jmp)\s+(?:fd4c04|fd4c34)\b',op):
              print(f'### 0x{a:x}; FDE={fde(a)}: {op}')
              ctx(a,22,36); print()

          print('## Relocation slots targeting fd4c04/fd4c34')
          slots=[]
          for l in rel_lines:
            if re.search(r'\b(?:fd4c04|fd4c34)\b',l):
              print(l)
              p=l.split()
              if p and re.fullmatch(r'[0-9a-fA-F]+',p[0]): slots.append(int(p[0],16))
          print()

          print('## Relocation neighborhoods around any target slots')
          # Parse RELATIVE reloc map for table slices.
          rel={}
          for l in rel_lines:
            p=l.split()
            if len(p)>=3 and re.fullmatch(r'[0-9a-fA-F]+',p[0]) and 'R_X86_64_RELATIVE' in l:
              j=p.index('R_X86_64_RELATIVE')
              if j+1<len(p) and re.fullmatch(r'[0-9a-fA-F]+',p[j+1]):
                rel[int(p[0],16)]=int(p[j+1],16)
          for s in slots:
            print(f'### slot 0x{s:x}')
            for va in range(s-0x50,s+0x58,8):
              v=rel.get(va)
              if v is not None: print(f'- 0x{va:x}: 0x{v:x} FDE={fde(v)}')
            print()

          print('## Code refs to candidate table address points around target slot')
          aps=set()
          for s in slots:
            for delta in range(-0x80,0x81,8):
              ap=s+delta
              # crude table candidate: >=4 code funcs in first 0x50
              cnt=sum(1 for off in range(0,0x50,8) if rel.get(ap+off) and fde(rel[ap+off]))
              if cnt>=4: aps.add(ap)
          for ap in sorted(aps):
            print(f'### candidate AP 0x{ap:x}')
            for a,i,op,l in ins:
              if f'# {ap:x} ' in l or l.rstrip().endswith(f'# {ap:x}'):
                print(f'- materialized @0x{a:x}; FDE={fde(a)}')
                ctx(a,18,28)
            print()

          print('## All calls in known adapter construction family fd47e6..fd4da0')
          for a,i,op,l in ins:
            if 0xfd47e6<=a<0xfd4da0 and '\tcall' in l:
              print(l)
          print()

          # Find functions that take a wrapper-like pointer and read +0x10 then +0x40.
          print('## Exact nested source pattern elsewhere: load [X+0x10], then [loaded+0x40]')
          rows=ins
          for k,(a,i,op,l) in enumerate(rows):
            m=re.match(r'mov\s+(r\w+),QWORD PTR \[(r\w+)\+0x10\]',op)
            if not m:continue
            dst=m.group(1)
            for aa,ii,oo,ll in rows[k+1:min(len(rows),k+10)]:
              if re.search(r'QWORD PTR \['+re.escape(dst)+r'\+0x40\]',oo):
                print(f'### 0x{a:x} -> 0x{aa:x}; FDE={fde(a)}')
                ctx(a,10,20); print()
                break
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/fd4c04-skipad-source.md
          git diff --cached --quiet && exit 0
          git commit -m "Resolve fd4c04 Skip Ad source object"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

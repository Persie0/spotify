name: Trace smart skip provider object origins

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trace-smart-skip-provider-origins.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/provorig
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/provorig
      - name: Trace
        run: |
          SO=/tmp/provorig/liborbit-jni-spotify.so
          objdump -d -M intel --start-address=0x135d056 --stop-address=0x135fc20 "$SO" > /tmp/provorig/ctor.dis
          {
            echo '# Smart skip interval-provider object origins'
            echo
            echo 'Known final pointers:'
            echo '- dependency+0xb08 = [rsp+0x70] + 0x10'
            echo '- dependency+0xb10 = [rsp+0x48] + 0x10'
            echo
            python3 - <<'PY'
          from pathlib import Path
          import re
          lines=Path('/tmp/provorig/ctor.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m:ins.append((int(m.group(1),16),i,m.group(2),l))

          for slot in ('70','48'):
            print(f'## All writes/reads of rsp+0x{slot}')
            hits=[]
            for a,i,op,l in ins:
              if f'[rsp+0x{slot}]' in op:
                hits.append((a,i,op,l))
                print(f'### 0x{a:x}: {op}')
                for x in lines[max(0,i-14):min(len(lines),i+28)]:print('    '+x)
                print()
            print(f'- total hits: {len(hits)}')
            print()

            writes=[]
            for a,i,op,l in hits:
              left=op.split(',',1)[0]
              if f'[rsp+0x{slot}]' in left and re.match(r'(mov|lea|xchg|and|xor|or)',op):
                writes.append((a,i,op,l))
            print(f'## Writes to rsp+0x{slot} only')
            for a,i,op,l in writes:
              print(l)
            if writes:
              a,i,op,l=writes[-1]
              print(f'### Last write before final consumer: 0x{a:x}: {op}')
              for x in lines[max(0,i-80):min(len(lines),i+110)]:print('    '+x)
            print()

          print('## Constructor entry argument spills')
          for a,i,op,l in ins[:180]:
            if re.search(r'\b(rdi|rsi|rdx|rcx|r8|r9)\b',op) and '[rsp+' in op:
              print(l)
          PY
          } > analysis/smart-skip-provider-origins.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/smart-skip-provider-origins.md
          git diff --cached --quiet && exit 0
          git commit -m "Trace smart skip provider object origins"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1

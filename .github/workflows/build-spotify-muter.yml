name: Build Spotify Ad Muter

on:
  workflow_dispatch:
  push:
    paths:
      - "spotify-muter/**"
      - ".github/workflows/build-spotify-muter.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            spotify-muter
          sparse-checkout-cone-mode: true

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: gradle -p spotify-muter :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle -p spotify-muter :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spotify-ad-muter-debug
          path: spotify-muter/app/build/outputs/apk/debug/app-debug.apk

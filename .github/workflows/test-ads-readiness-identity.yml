name: Test Ads object readiness identity

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-ads-readiness-identity.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true
      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/adsident
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/adsident
      - name: Install helper
        run: python3 -m pip install --quiet pyelftools
      - name: Trace identity
        run: |
          SO=/tmp/adsident/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/adsident/all.dis
          python3 - <<'PY' > analysis/ads-readiness-object-identity.md
          from pathlib import Path
          import re,bisect
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          lines=Path('/tmp/adsident/all.dis').read_text(errors='replace').splitlines()
          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m:ins.append((int(m.group(1),16),i,m.group(2),l))
          addrs=[x[0] for x in ins]
          with open('/tmp/adsident/liborbit-jni-spotify.so','rb') as f:
            elf=ELFFile(f);dwarf=elf.get_dwarf_info();fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location'];z=a+e['address_range']
                if z>a:fdes.append((a,z))
          fdes.sort();starts=[a for a,z in fdes]
          def fde(a):
            k=bisect.bisect_right(starts,a)-1
            if k>=0 and fdes[k][0]<=a<fdes[k][1]:return fdes[k]
          def idx(a):return bisect.bisect_left(addrs,a)
          def ctx(a,b=18,n=32):
            j=idx(a)
            for x in ins[max(0,j-b):min(len(ins),j+n+1)]:print('    '+x[3])
          def body(fr):
            j=idx(fr[0]);out=[]
            for x in ins[j:]:
              if x[0]>=fr[1]:break
              out.append(x)
            return out

          print('# Ads runtime object vs Skip Ad readiness-source identity')
          print()
          print('Known:')
          print('- registry ID 4 = AdsSetupImpl')
          print('- b85f7e returns AdsSetupImpl service instance')
          print('- service +0x28 returns object whose +0x1b8 is sampled for readiness')
          print('- signal-adapter constructor input uses +0x10, +0x1b2, +0x1b5, and nearby fields')
          print()

          # AdsSetupImpl factory.
          af=fde(0xb86086)
          print(f'## AdsSetupImpl factory 0xb86086 FDE={af}')
          if af:
            rows=body(af)
            # Print allocations, vptr stores, +0x28-related object stores, and calls to readiness constructor family.
            for k,(a,i,op,l) in enumerate(rows):
              if (re.search(r'call\s+17edf00\b',op) or
                  '# 18' in l or '# 19' in l or
                  re.search(r'\+0x1b[258]\]',op) or
                  0xef9000<=int(re.search(r'call\s+([0-9a-f]+)',op).group(1),16)<0xf00000 if re.search(r'call\s+([0-9a-f]+)',op) else False):
                print(f'### 0x{a:x}: {op}')
                for x in rows[max(0,k-8):min(len(rows),k+18)]:print('    '+x[3])
                print()

          # Exact readiness constructor FDE and its callers.
          rf=fde(0xef9217)
          print(f'## Readiness/signal setup FDE around 0xef9217: {rf}')
          if rf:
            print('### Entry/prologue')
            for a,i,op,l in body(rf)[:120]:print('    '+l)
            print()
            print('### Direct calls/jumps to FDE entry')
            for a,i,op,l in ins:
              if re.search(r'\b(?:call|jmp)\s+'+format(rf[0],'x')+r'\b',op):
                print(f'caller 0x{a:x}; FDE={fde(a)}')
                ctx(a,30,45);print()

          # Any code call in Ads factory to readiness FDE address range.
          if af and rf:
            print('## AdsSetupImpl-factory calls into readiness FDE')
            for a,i,op,l in body(af):
              m=re.search(r'\bcall\s+([0-9a-f]+)\b',op)
              if m and rf[0]<=int(m.group(1),16)<rf[1]:
                print(f'### 0x{a:x}: {op}')
                ctx(a,20,30);print()

          # Compare functions that access both +0x1b8 and +0x10 on same base register.
          print('## FDEs touching both +0x10 and +0x1b8')
          by={}
          memre=re.compile(r'\[([a-z0-9]+)\+0x([0-9a-f]+)\]')
          for a,i,op,l in ins:
            fr=fde(a)
            if not fr:continue
            for m in memre.finditer(op):
              off=int(m.group(2),16)
              if off in (0x10,0x1b8):
                by.setdefault((fr,m.group(1)),set()).add(off)
          for (fr,base),offs in by.items():
            if offs=={0x10,0x1b8}:
              print(f'### FDE 0x{fr[0]:x}..0x{fr[1]:x} base={base}')
              for a,i,op,l in body(fr):
                if f'[{base}+0x10]' in op or f'[{base}+0x1b8]' in op:print('    '+l)
              print()

          # Owner of the readiness-slot array: recover rbx definition in 13524a4 FDE.
          ff=fde(0x1352547)
          print(f'## +0x1b8-gated factory owner rbx; FDE={ff}')
          if ff:
            rows=body(ff)
            target=next((k for k,x in enumerate(rows) if x[0]==0x1352607),None)
            if target is not None:
              print('### Backward rbx definitions before slot-address fanout')
              n=0
              for k in range(target-1,-1,-1):
                a,i,op,l=rows[k]
                if re.match(r'(mov|lea|xchg|pop)\s+rbx\b',op):
                  print(f'- 0x{a:x}: {op}')
                  for x in rows[max(0,k-16):min(len(rows),k+24)]:print('    '+x[3])
                  print()
                  n+=1
                  if n>=4:break

          # Track direct stores to objects at +0x10 where nearby +0x1b8 is also touched.
          print('## Direct +0x10 pointer writes in ad/readiness neighborhoods')
          for a,i,op,l in ins:
            if not ((0xb85000<=a<0xb89000) or (0xef8000<=a<0xf00000) or (0x1352000<=a<0x1354000)):
              continue
            left=op.split(',',1)[0]
            if '+0x10]' in left and re.match(r'(mov|lea|xchg)',op):
              print(f'### 0x{a:x}: {op}; FDE={fde(a)}')
              ctx(a,10,15);print()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/ads-readiness-object-identity.md
          git diff --cached --quiet && exit 0
          git commit -m "Test Ads readiness object identity"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 1; done
          exit 1

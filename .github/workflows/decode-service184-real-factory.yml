name: Decode service184 real factory 17dbc9a

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/decode-service184-real-factory.yml"

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            analysis
            docs
          sparse-checkout-cone-mode: true

      - name: Download Orbit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input /tmp/s184real
          gh release download r1 --repo "${{ github.repository }}" --pattern "spotify-9-1-84-2205.apk" --dir input
          unzip -j input/spotify-9-1-84-2205.apk 'lib/x86_64/liborbit-jni-spotify.so' -d /tmp/s184real

      - name: Install helpers
        run: python3 -m pip install --quiet pyelftools

      - name: Decode real factory
        run: |
          SO=/tmp/s184real/liborbit-jni-spotify.so
          objdump -d -M intel "$SO" > /tmp/s184real/all.dis
          python3 - <<'PY' > analysis/service184-real-factory.md
          from pathlib import Path
          import re, struct
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE

          so=Path('/tmp/s184real/liborbit-jni-spotify.so')
          data=so.read_bytes()
          lines=Path('/tmp/s184real/all.dis').read_text(errors='replace').splitlines()

          with so.open('rb') as f:
            elf=ELFFile(f)
            loads=[]
            for seg in elf.iter_segments():
              if seg['p_type']=='PT_LOAD':
                loads.append((seg['p_offset'],seg['p_offset']+seg['p_filesz'],seg['p_vaddr']))
            dwarf=elf.get_dwarf_info()
            fdes=[]
            for e in dwarf.EH_CFI_entries():
              if isinstance(e,FDE):
                a=e['initial_location']; b=a+e['address_range']
                if b>a: fdes.append((a,b))
            fdes.sort()
            relocs={}
            for sec in elf.iter_sections():
              if sec['sh_type'] not in ('SHT_RELA','SHT_REL'): continue
              for rel in sec.iter_relocations():
                add=rel.entry.get('r_addend')
                if add is not None: relocs[rel['r_offset']]=add

          ins=[]
          for i,l in enumerate(lines):
            m=re.match(r'^\s*([0-9a-f]+):\s+(?:[0-9a-f]{2}\s+)+\s*(.*)$',l)
            if m: ins.append((int(m.group(1),16),i,m.group(2),l))

          def fde_for(addr):
            lo,hi=0,len(fdes)
            while lo<hi:
              mid=(lo+hi)//2
              if fdes[mid][0]<=addr:lo=mid+1
              else:hi=mid
            for k in range(max(0,lo-8),min(len(fdes),lo+2)):
              a,b=fdes[k]
              if a<=addr<b:return a,b

          def ctx(i,b=16,a=28):
            for x in lines[max(0,i-b):min(len(lines),i+a+1)]: print('    '+x)

          def va_to_off(va):
            for a,b,v in loads:
              if v<=va<v+(b-a): return a+(va-v)

          def qword(va):
            if va in relocs:return relocs[va]
            o=va_to_off(va)
            if o is None or o+8>len(data):return None
            return struct.unpack_from('<Q',data,o)[0]

          target=0x17dbc9a
          fr=fde_for(target)
          print('# Service184 real factory 0x17dbc9a')
          print()
          print('Entry contract inherited from 0x15da3b7:')
          print('- rdi = output object / 24-byte return aggregate')
          print('- rsi = type/key string at 0x32f434')
          print('- rdx = normalized source string')
          print('- rcx = normalized config string')
          print('- output +0x10 is later moved into serviceTable[184]')
          print()
          print(f'## Factory FDE {fr}')
          if fr:
            for a,i,op,l in ins:
              if fr[0]<=a<fr[1]:print(l)
          print()

          print('## Writes through destination aliases')
          # Collect likely aliases assigned from initial rdi in prologue.
          aliases={'rdi'}
          if fr:
            for a,i,op,l in ins:
              if not(fr[0]<=a<fr[1]):continue
              m=re.match(r'mov\s+(r(?:bx|12|13|14|15|bp|si|di|ax|cx|dx)),rdi\b',op)
              if m: aliases.add(m.group(1))
            print('- aliases: '+', '.join(sorted(aliases)))
            for a,i,op,l in ins:
              if not(fr[0]<=a<fr[1]):continue
              if not re.match(r'(mov|movups|movaps|movdqu|movdqa|and|xor|lea)',op):continue
              if any(re.search(r'\['+re.escape(reg)+r'(?:\+0x(?:8|10|18|20|28|30|38|40))?\]',op) for reg in aliases):
                print(f'### 0x{a:x}: {op}')
                ctx(i,10,18); print()

          print('## Heap allocations')
          if fr:
            for a,i,op,l in ins:
              if fr[0]<=a<fr[1] and re.search(r'call\s+17edf00\b',op):
                print(f'### allocation @0x{a:x}')
                ctx(i,24,45); print()

          print('## High-address constants and possible vptr materializations')
          candidates=[]
          if fr:
            for a,i,op,l in ins:
              if not(fr[0]<=a<fr[1]):continue
              m=re.search(r'#\s*([0-9a-f]+)\b',l)
              if not m:continue
              va=int(m.group(1),16)
              if va>=0x1800000:
                candidates.append(va)
                print(f'### 0x{a:x}: {op}')
                ctx(i,8,14); print()

          print('## Candidate table neighborhoods')
          for va in sorted(set(candidates)):
            print(f'### around 0x{va:x}')
            for base in range(max(0,va-0x20),va+0x21,8):
              vals=[]
              code=0
              for off in range(0,0x80,8):
                q=qword(base+off)
                vals.append((off,q))
                if q is not None and fde_for(q): code+=1
              if code<4: continue
              print(f'- address point 0x{base:x}; code slots={code}')
              for off,q in vals:
                print(f'  - +0x{off:x}: {("0x%x"%q) if q is not None else "None"} FDE={fde_for(q) if q else None}')
            print()

          print('## Calls in factory and return-value stores')
          if fr:
            for a,i,op,l in ins:
              if fr[0]<=a<fr[1] and re.search(r'\bcall\b',op):
                print(f'### call @0x{a:x}: {op}')
                ctx(i,6,14); print()

          print('## Direct callers of 0x17dbc9a')
          for a,i,op,l in ins:
            if re.search(r'(?:call|jmp)\s+17dbc9a\b',op):
              print(f'### caller/xfer 0x{a:x}; FDE={fde_for(a)}')
              ctx(i,12,20); print()
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/service184-real-factory.md
          git diff --cached --quiet && exit 0
          git commit -m "Decode service184 real factory"
          git pull --rebase origin main
          git push origin HEAD:main
